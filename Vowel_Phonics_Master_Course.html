<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b82"><title>Vowel & Phonics Master Course</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#18233e;font:16px Arial;line-height:1.5}header{background:linear-gradient(120deg,#142c67,#2768d8);color:white;text-align:center;padding:22px 12px}main{max-width:1000px;margin:auto;padding:14px}.brand{font-weight:bold}h1{margin:5px}button,select{border:0;border-radius:10px;padding:11px;margin:4px;cursor:pointer;font-size:15px}button{background:#2463eb;color:white;font-weight:bold}.tabs{display:flex;overflow:auto;gap:6px;padding:8px 0}.tabs button{white-space:nowrap}.panel{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #142c6712}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.word{border:1px solid #dce5f5;border-radius:13px;padding:10px;text-align:center}.word img{width:100%;height:115px;object-fit:cover;border-radius:9px}.word b{display:block;font-size:20px;color:#173b82}.sound{background:#eef4ff;border-radius:8px;padding:4px 8px}.note{background:#fff4c2;padding:10px;border-radius:10px}footer{text-align:center;padding:18px;color:#64708a}@media(max-width:500px){main{padding:9px}}
</style><header><div class="brand">SCIENCE CENTRE LEARNING HUB</div><h1>Vowel & Phonics Master Course</h1><b>Guided by Vishwendra Sir</b><p>English + हिन्दी · Learn · Listen · Play · Practice</p></header><main><div class="panel"><label>Language <select id="lang"><option value="both">English + हिन्दी</option><option>English</option><option>हिन्दी</option></select></label><label>Voice speed <select id="speed"><option value=".75">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select></label><button onclick="say('Welcome to vowel and phonics master course')">🔊 Welcome</button><button onclick="speechSynthesis.cancel()">Stop</button></div><nav class="tabs" id="tabs"></nav><section id="view"></section></main><footer>SCIENCE CENTRE LEARNING HUB — Guided by Vishwendra Sir<br>Lessons work offline. Real photographs and device voice may require internet/device support.</footer><script>
const sets=[
["Short Vowels","A","æ","Apple","सेब","Ant, Axe, Bag, Cat, Map, Fan"],["Short Vowels","E","ɛ","Egg","अंडा","Elephant, Hen, Bed, Pen, Net, Leg"],["Short Vowels","I","ɪ","Ink","स्याही","Igloo, Pin, Fish, Sit, Milk, Lip"],["Short Vowels","O","ɒ","Orange","संतरा","Ox, Pot, Dog, Fox, Box, Hot"],["Short Vowels","U","ʌ","Umbrella","छाता","Up, Cup, Sun, Bus, Nut, Run"],
["Long Vowels","A","ā","Cake","केक","Name, Game, Lake, Plane, Late"],["Long Vowels","E","ē","Tree","पेड़","Bee, Feet, These, Theme, Eve"],["Long Vowels","I","ī","Kite","पतंग","Bike, Five, Time, Smile, Shine"],["Long Vowels","O","ō","Rose","गुलाब","Home, Nose, Stone, Hope, Phone"],["Long Vowels","U","yoo/oo","Cube","घन","Mule, Cute, Flute, June, Rule"],
["Double Vowel Teams","AI","ā","Rain","बारिश","Train, Paint, Brain, Chain, Snail"],["Double Vowel Teams","AY","ā","Day","दिन","Play, Stay, Spray, Tray, Clay"],["Double Vowel Teams","EE","ē","Bee","मधुमक्खी","Feet, Green, Sleep, Street, Cheese"],["Double Vowel Teams","EA","ē / ɛ","Leaf","पत्ता","Eat, Dream, Teach, Clean, Bread, Head"],["Double Vowel Teams","OA","ō","Boat","नाव","Coat, Road, Toast, Float, Goat"],["Double Vowel Teams","OW","ō / ou","Snow","बर्फ","Grow, Show, Window, Cow, Brown"],["Double Vowel Teams","IE","ī / ē","Pie","पाई","Tie, Lie, Field, Chief, Piece"],["Double Vowel Teams","IGH","ī","Night","रात","Light, Bright, Flight, Right, High"],["Double Vowel Teams","OO","oo / ʊ","Moon","चाँद","Food, Spoon, Book, Foot, Good"],["Double Vowel Teams","OU","ou / ʌ","Cloud","बादल","House, Mouse, Mouth, Soup, Young"],["Double Vowel Teams","OI","oi","Coin","सिक्का","Oil, Point, Voice, Join, Noise"],["Double Vowel Teams","OY","oi","Boy","लड़का","Toy, Enjoy, Royal, Joy"],["Double Vowel Teams","AU","aw","Autumn","पतझड़","August, Haul, Cause, Pause"],["Double Vowel Teams","AW","aw","Saw","आरी / देखा","Draw, Claw, Straw, Dawn, Paw"],["Double Vowel Teams","EW","yoo/oo","New","नया","Few, Chew, Flew, Crew, Stew"],["Double Vowel Teams","UE","oo/yoo","Blue","नीला","Glue, True, Rescue, Cue, Clue"],
["R-Controlled","AR","ar","Car","कार","Farm, Star, Park, Hard, Shark"],["R-Controlled","ER","er","Her","उसकी","Term, Verb, Person, Fern"],["R-Controlled","IR","er","Bird","चिड़िया","Girl, Shirt, First, Third, Dirt"],["R-Controlled","OR","or","Corn","मक्का","Fork, Horse, Short, Storm"],["R-Controlled","UR","er","Turn","मुड़ना","Burn, Nurse, Purple, Fur"],
["Silent-E","A-E","ā","Cake","केक","Make, Shake, Plane, Brave"],["Silent-E","E-E","ē","These","ये","Theme, Complete, Even"],["Silent-E","I-E","ī","Time","समय","Smile, Shine, Drive, Prize"],["Silent-E","O-E","ō","Home","घर","Stone, Hope, Close, Smoke"],["Silent-E","U-E","yoo/oo","Cube","घन","June, Rule, Flute, Cute"],
["Advanced","ALL","all","Ball","गेंद","Call, Small, Tall, Wall"],["Advanced","OULD","ud","Could","सकना","Would, Should"],["Advanced","EAR","eer/air/er","Hear","सुनना","Near, Dear, Bear, Learn"],["Advanced","AIR","air","Hair","बाल","Chair, Fair, Pair, Stair"],["Advanced","ARE","air","Care","देखभाल","Share, Square, Rare, Prepare"]];
const sections=["Start Here",...new Set(sets.map(x=>x[0])),"Blend & Read","Game","Quiz"];
const tabs=document.getElementById("tabs"),view=document.getElementById("view");let quizN=0,score=0;
sections.forEach((s,i)=>{let b=document.createElement("button");b.textContent=s;b.onclick=()=>show(s);tabs.append(b)});
function say(t){if(!("speechSynthesis"in window)){alert("Speech synthesis not supported");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=+document.getElementById("speed").value;u.lang="en-IN";speechSynthesis.speak(u)}
function photo(w){return "https://loremflickr.com/480/320/"+encodeURIComponent(w)}
function show(s){if(s==="Start Here"){view.innerHTML='<div class="panel"><h2>Welcome to Vowel Sounds!</h2><p>Master A, E, I, O, U through short and long vowels, vowel teams, R-controlled sounds and silent-E patterns.</p><div class="note">Listen → Repeat → Read → Blend → Practise. हिन्दी अर्थ भी साथ में दिए गए हैं।</div><p><b>5 vowels:</b> A · E · I · O · U</p><p><b>Learning levels:</b> Short vowels, Long vowels, Double vowel teams, R-controlled vowels, Silent-E, Advanced patterns.</p></div>';return}
if(s==="Blend & Read"){let words=["C-A-T → CAT","B-A-G → BAG","P-E-N → PEN","F-I-SH → FISH","D-O-G → DOG","S-U-N → SUN","R-AI-N → RAIN","P-L-AY → PLAY","S-LE-E-P → SLEEP","B-OA-T → BOAT","N-IGH-T → NIGHT","C-OU-D → CLOUD"];view.innerHTML='<div class="panel"><h2>Blend & Read</h2><p>Say each sound, then join them to read the word.</p><div class="grid">'+words.map(w=>'<div class="word"><b>'+w+'</b><button onclick="say(\''+w+'\')">🔊 Listen</button></div>').join("")+'</div></div>';return}
if(s==="Game"){let item=sets[Math.floor(Math.random()*sets.length)];view.innerHTML='<div class="panel"><h2>🎮 Pattern Match</h2><p>Which vowel pattern is in <b>'+item[3]+'</b>?</p><img width="180" src="'+photo(item[3])+'"><div class="grid">'+[item,...sets.filter(x=>x[1]!==item[1]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5).map(x=>'<button onclick="document.getElementById(\'msg\').textContent=\''+(x[1]===item[1]?'Correct! शाबाश!':'Try again. Answer: '+item[1])+'\'">'+x[1]+'</button>').join("")+'</div><h3 id="msg"></h3><button onclick="show(\'Game\')">Next game</button></div>';return}
if(s==="Quiz"){quizN=0;score=0;quizShow();return}
let rows=sets.filter(x=>x[0]===s);view.innerHTML='<div class="panel"><h2>'+s+'</h2><p>Look at the pattern, listen to the word and repeat it aloud.</p><div class="grid">'+rows.map(x=>'<article class="word"><h2>'+x[1]+'</h2><span class="sound">Sound: '+x[2]+'</span><img loading="lazy" src="'+photo(x[3])+'" alt="'+x[3]+'" onerror="this.src=\'https://placehold.co/480x320/eaf2ff/173b82?text=Photo\'"><b>'+x[3]+'</b><small>'+x[4]+'</small><button onclick="say(\''+x[3]+'\')">🔊 Listen</button><p>'+x[5].split(", ").map(w=>'<span class="sound">'+w+'</span>').join(" ")+'</p><button onclick="say(\''+x[5]+'\')">Listen to more words</button></article>').join("")+'</div></div>'}
const qs=[["Short A word?",["Cake","Cat","Rain"],1],["Long I word?",["Pin","Kite","Milk"],1],["RAIN vowel team?",["EE","AI","OA"],1],["Word with EE?",["Bread","Feet","Boat"],1],["Word with OA?",["Goat","Coin","Night"],0],["Short U word?",["Cube","Cup","June"],1],["Pattern in BIRD?",["AR","IR","OA"],1],["Word with OI?",["Boy","Coin","Blue"],1],["Silent-E word?",["Hop","Hope","Hot"],1],["OW as in cow?",["Snow","Brown","Show"],1]];
function quizShow(){if(quizN>=qs.length){view.innerHTML='<div class="panel"><h2>Quiz Complete!</h2><h1>'+score+'/'+qs.length+'</h1><button onclick="show(\'Quiz\')">Try again</button></div>';return}let q=qs[quizN];view.innerHTML='<div class="panel"><h2>📝 Quiz · Question '+(quizN+1)+'/'+qs.length+'</h2><h3>'+q[0]+'</h3>'+q[1].map((o,i)=>'<button style="display:block;width:100%;text-align:left;margin:8px 0" onclick="quizAnswer('+i+')">'+o+'</button>').join("")+'<p id="feed"></p><button id="next" disabled onclick="quizN++;quizShow()">Next →</button></div>'}
function quizAnswer(i){let q=qs[quizN];if(i===q[2]){score++;document.getElementById("feed").textContent="Correct! शाबाश!";}else document.getElementById("feed").textContent="Correct answer: "+q[1][q[2]];document.getElementById("next").disabled=false}
show("Start Here");
</script></html>
