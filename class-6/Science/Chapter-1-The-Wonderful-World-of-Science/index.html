<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f"><meta name="description" content="Class 6 Science Chapter 1 interactive bilingual learning book">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg">
<title>Class 6 Science — Chapter 1 | Science Centre Learning Hub</title>
<style>body{margin:0;background:#f3f6fc;color:#172033;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.card{max-width:560px;margin:20px;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 32px #19366b18}h1{color:#173b8f}button{border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 18px;font-weight:700}small{color:#66738b}</style></head>
<body><div class="card"><h1>SCIENCE CENTRE LEARNING HUB</h1><b>Guided by Vishwendra Sir</b><p id="status">Loading your interactive Chapter 1 learning book…</p><small>First load requires internet. After caching, the app shell is available offline.</small></div>
<script>
(async()=>{const s=document.getElementById('status');try{
const r=await fetch('./book-v2.html.gz.b64');if(!r.ok)throw Error('Learning content file not found ('+r.status+').');
const b64=(await r.text()).trim();const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
if(!('DecompressionStream'in window))throw Error('This browser does not support built-in gzip decompression. Please update Chrome.');
const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
const html=await new Response(stream).text();document.open();document.write(html);document.close();
}catch(e){s.textContent='Could not load the learning book: '+e.message+' Please check your internet connection and reload.';}})();
</script></body></html>
