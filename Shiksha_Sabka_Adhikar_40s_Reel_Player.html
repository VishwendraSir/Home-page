<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b4b"><title>शिक्षा सबका अधिकार | 40s Reel</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080d22;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}.phone{width:min(390px,94vw);aspect-ratio:9/16;border:3px solid #22d3ee;border-radius:28px;padding:20px 17px;background:linear-gradient(160deg,#0b1538,#302064 55%,#075441);display:flex;flex-direction:column;justify-content:space-between;text-align:center;box-shadow:0 20px 60px #0009}.meta{display:flex;justify-content:space-between;color:#bae6fd;font-size:12px;font-weight:800}.track{height:6px;background:#ffffff30;border-radius:10px;margin-top:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#fbbf24,#ec4899)}.stage{margin:auto 0}.tag{display:inline-block;color:#fde68a;border:1px solid #fbbf24;border-radius:30px;padding:5px 11px;font-size:11px;font-weight:900}.stage h1{font-size:clamp(22px,6vw,30px);line-height:1.2}.voice{background:#07152ddd;border:1px solid #7dd3fc88;border-radius:17px;padding:14px;line-height:1.55;font-weight:700}.sub{color:#67e8f9;font-size:13px;font-weight:800;margin-top:12px}.brand{font-size:12px;line-height:1.6;font-weight:800}.brand b{color:#fde047}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:#22d3ee;color:#071326}button.alt{background:#1e293b;color:white;border:1px solid #64748b}button:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}
</style></head><body>
<div class="phone"><div><div class="meta"><span>शिक्षा सबका अधिकार • 9:16</span><span id="timer">00s / 40s</span></div><div class="track"><div class="fill" id="progress"></div></div></div>
<div class="stage"><span class="tag" id="tag">SCENE 1 • HOOK</span><h1 id="heading">क्या अच्छी शिक्षा सिर्फ अमीर बच्चों का अधिकार है?</h1><div class="voice" id="voice">क्या आपके बच्चे का भविष्य महंगी फीस पर निर्भर होना चाहिए?</div><div class="sub" id="sub">Free Learning for Every Child</div></div>
<div class="brand"><b>SCIENCE CENTRE LEARNING HUB</b><br>GUIDED BY VISHWENDRA SIR<br>महंगी कोचिंग नहीं, सही मार्गदर्शन जरूरी है!<br>📞 6350248088</div></div>
<div class="controls"><button onclick="play()">▶ Play 40s</button><button class="alt" onclick="pause()">⏸ Pause</button><button class="alt" onclick="restart()">↺ Restart</button><button class="alt" onclick="speak()">🔊 Speak Voiceover</button></div>
<script>
const scenes=[
{a:0,b:8,t:"SCENE 1 • POWERFUL HOOK",h:"क्या अच्छी शिक्षा सिर्फ अमीर बच्चों का अधिकार है?",v:"क्या आपके बच्चे का भविष्य महंगी फीस पर निर्भर होना चाहिए?",s:"अब महंगी कोचिंग और महंगे प्राइवेट स्कूल ही सफलता का रास्ता नहीं हैं।"},
{a:8,b:16,t:"SCENE 2 • EQUALITY & DIGITAL",h:"प्रतिभा किसी महंगी स्कूल की मोहताज नहीं होती।",v:"गणित, विज्ञान, अंग्रेज़ी, सामान्य ज्ञान और क्विज़—डिजिटल सीखने के अवसर हर बच्चे तक पहुँच सकते हैं।",s:"सरकारी स्कूल या कोई भी स्कूल—सीखने का अधिकार सबका है।"},
{a:16,b:25,t:"SCENE 3 • WONDER WORLD",h:"MANUSHREE WONDER WORLD",v:"Manushree Candy Garden, Shree Ocean Discovery और Ram Dino Space Quest—खेल और विज्ञान से सीखने का संसार।",s:"Playgroup to Class 8 • Hindi + English"},
{a:25,b:33,t:"SCENE 4 • ONE WORLD ONE DREAM",h:"ONE WORLD 🌍 ONE DREAM",v:"हमारा सपना है—भारत ही नहीं, पूरी दुनिया का हर बच्चा सीखे, आगे बढ़े और अपने सपनों को पूरा करे।",s:"FREE LEARNING FOR EVERY CHILD"},
{a:33,b:40,t:"SCENE 5 • CALL TO ACTION",h:"शिक्षा सबका अधिकार है!",v:"बच्चों की शिक्षा के इस अभियान से जुड़िए। हर बच्चे तक मुफ्त सीखने के अवसर पहुँचाएँ। क्योंकि शिक्षा सबका अधिकार है!",s:"SCIENCE CENTRE LEARNING HUB • 6350248088"}];
let sec=0,timer=null,ctx=null,lastScene=-1;
function render(){let n=Math.min(40,sec);document.getElementById('timer').textContent=String(Math.floor(n)).padStart(2,'0')+'s / 40s';document.getElementById('progress').style.width=(n/40*100)+'%';let x=scenes.find(z=>n>=z.a&&n<z.b)||scenes[4];let i=scenes.indexOf(x);document.getElementById('tag').textContent=x.t;document.getElementById('heading').textContent=x.h;document.getElementById('voice').textContent='“'+x.v+'”';document.getElementById('sub').textContent=x.s;if(i!==lastScene&&lastScene!==-1)chime(523);lastScene=i}
function chime(f){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ctx)ctx=new C();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0008,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}catch(e){}}
function play(){if(timer)return;if(sec>=40)restart();chime(440);timer=setInterval(()=>{sec=Math.min(40,sec+.1);render();if(sec>=40)pause()},100)}
function pause(){if(timer){clearInterval(timer);timer=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function restart(){pause();sec=0;lastScene=-1;render()}
function speak(){if(!('speechSynthesis'in window))return;let x=scenes.find(z=>sec>=z.a&&sec<z.b)||scenes[4];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.v);u.lang='hi-IN';u.rate=.95;speechSynthesis.speak(u)}
render();
</script></body></html>
