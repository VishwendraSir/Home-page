  <script>
    /* =========================================================================
       1. SAFE STORAGE, ERROR BOUNDARIES & AUDIO/VOICE/WHATSAPP UTILITIES
       ========================================================================= */
    const MemoryStorageFallback = (() => {
      const map = new Map();
      return {
        getItem: (k) => (map.has(k) ? map.get(k) : null),
        setItem: (k, v) => { map.set(k, String(v)); },
        removeItem: (k) => { map.delete(k); }
      };
    })();

    const safeStorage = (() => {
      let persistent = false;
      try {
        const probe = '__lk_probe__';
        window.localStorage.setItem(probe, 'ok');
        window.localStorage.removeItem(probe);
        persistent = true;
      } catch (_err) {
        persistent = false;
      }

      return {
        isPersistent: () => persistent,
        get(key) {
          try {
            if (persistent) return window.localStorage.getItem(key);
          } catch (_e) {}
          return MemoryStorageFallback.getItem(key);
        },
        set(key, value) {
          MemoryStorageFallback.setItem(key, value);
          try {
            if (persistent) window.localStorage.setItem(key, value);
          } catch (_e) {}
        },
        remove(key) {
          MemoryStorageFallback.removeItem(key);
          try {
            if (persistent) window.localStorage.removeItem(key);
          } catch (_e) {}
        }
      };
    })();

    function showDiagnostic(msg) {
      try {
        const banner = document.getElementById('diagnostic-banner');
        const label = document.getElementById('diagnostic-message');
        if (banner && label) {
          label.textContent = String(msg || 'Diagnostic alert');
          banner.classList.remove('hidden');
        }
      } catch (_e) {}
    }

    window.addEventListener('error', (ev) => {
      showDiagnostic(`Error boundary caught: ${ev && ev.message ? ev.message : 'Unexpected error'}`);
    });

    window.addEventListener('unhandledrejection', (ev) => {
      const reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Promise rejection';
      showDiagnostic(`Async boundary caught: ${reason}`);
    });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      try {
        const host = document.getElementById('toast-container');
        if (!host) return;
        const palette = {
          success: 'bg-agri-800 text-white border-agri-600',
          warning: 'bg-amber-700 text-white border-amber-500',
          error: 'bg-rose-800 text-white border-rose-600',
          info: 'bg-slate-900 text-white border-slate-700'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-lg text-xs font-bold flex items-center gap-2 fade-in ${palette[type] || palette.info}`;
        el.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${escapeHtml(message)}</span>`;
        host.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3000);
      } catch (_e) {}
    }

    function celebrateMilestone(points = 10, label = '') {
      try {
        if (typeof AppState !== 'undefined') {
          AppState.kisanPoints = (Number(AppState.kisanPoints) || 0) + points;
          persistState();
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.055, ctx.currentTime + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.07);
            osc.stop(ctx.currentTime + i * 0.07 + 0.24);
          });
        }
        runConfettiBurst();
        if (label) showToast(`${label} (+${points} Kisan Pts)`, 'success');
      } catch (_e) {}
    }

    function runConfettiBurst() {
      try {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.classList.remove('hidden');

        const colors = ['#22c55e', '#eab308', '#16a34a', '#f97316', '#0ea5e9'];
        const particles = Array.from({ length: 48 }, () => ({
          x: canvas.width * 0.5 + (Math.random() - 0.5) * 160,
          y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 11,
          vy: -Math.random() * 8.5 - 2,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI
        }));

        let tick = 0;
        function frame() {
          tick++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.34;
            p.rot += 0.14;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
            ctx.restore();
          });
          if (tick < 58) requestAnimationFrame(frame);
          else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.classList.add('hidden');
          }
        }
        requestAnimationFrame(frame);
      } catch (_e) {}
    }

    function speakText(text) {
      try {
        if (!('speechSynthesis' in window)) {
          showToast('Text-to-Speech is not supported on this device.', 'warning');
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(text || ''));
        utter.lang = AppState.lang === 'hi' ? 'hi-IN' : 'en-IN';
        utter.rate = 0.96;
        window.speechSynthesis.speak(utter);
      } catch (_e) {
        showToast('Could not play speech output.', 'warning');
      }
    }

    function startVoiceInput(inputId, onComplete = null) {
      try {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          showToast('Speech input is not supported in this browser.', 'warning');
          return;
        }
        const rec = new SR();
        rec.lang = AppState.lang === 'hi' ? 'hi-IN' : 'en-IN';
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        showToast(AppState.lang === 'hi' ? 'बोलिए... सुन रहा हूँ' : 'Listening... Speak now', 'info');
        rec.onresult = (e) => {
          const spoken = e.results[0][0].transcript;
          const el = document.getElementById(inputId);
          if (el) el.value = spoken;
          if (typeof onComplete === 'function') onComplete(spoken);
        };
        rec.onerror = () => showToast('Microphone capture stopped or unavailable.', 'warning');
        rec.start();
      } catch (_e) {
        showToast('Voice capture not available in this context.', 'warning');
      }
    }

    function loadState() {
      const defaults = createInitialState();
      try {
        const raw = safeStorage.get(APP_STATE_KEY);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return defaults;
        return {
          ...defaults,
          ...parsed,
          profile: { ...defaults.profile, ...(parsed.profile || {}) },
          checklist: { ...defaults.checklist, ...(parsed.checklist || {}) },
          weatherReadinessLog: Array.isArray(parsed.weatherReadinessLog) ? parsed.weatherReadinessLog : defaults.weatherReadinessLog,
          crops: Array.isArray(parsed.crops) && parsed.crops.length ? parsed.crops : defaults.crops,
          schemes: Array.isArray(parsed.schemes) && parsed.schemes.length ? parsed.schemes : defaults.schemes,
          marketItems: Array.isArray(parsed.marketItems) && parsed.marketItems.length ? parsed.marketItems : defaults.marketItems,
          financeLogs: Array.isArray(parsed.financeLogs) ? parsed.financeLogs : defaults.financeLogs,
          loanRecords: Array.isArray(parsed.loanRecords) ? parsed.loanRecords : defaults.loanRecords,
          communityPosts: Array.isArray(parsed.communityPosts) ? parsed.communityPosts : defaults.communityPosts,
          dairyLogs: Array.isArray(parsed.dairyLogs) ? parsed.dairyLogs : defaults.dairyLogs,
          calendarItems: Array.isArray(parsed.calendarItems) ? parsed.calendarItems : defaults.calendarItems,
          expertMessages: Array.isArray(parsed.expertMessages) && parsed.expertMessages.length ? parsed.expertMessages : defaults.expertMessages

    function syncIndexedDbMirror(stateObj) {
      try {
        if (!('indexedDB' in window)) return;
        const req = window.indexedDB.open('LavaniyaKrishiDB', 1);
        req.onupgradeneeded = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains('krishiStore')) {
            db.createObjectStore('krishiStore');
          }
        };
        req.onsuccess = (ev) => {
          try {
            const db = ev.target.result;
            const tx = db.transaction('krishiStore', 'readwrite');
            tx.objectStore('krishiStore').put({ updatedAt: Date.now(), state: stateObj }, 'appState');
            tx.oncomplete = () => {
              idbStatusText = safeStorage.isPersistent() ? 'localStorage + LavaniyaKrishiDB synced' : 'Memory + LavaniyaKrishiDB synced';
            };
          } catch (_e) {}
        };
      } catch (_e) {}
    }

    function persistState() {
      try {
        safeStorage.set(APP_STATE_KEY, JSON.stringify(AppState));
        syncIndexedDbMirror(AppState);
      } catch (_e) {}
    }

    function registerServiceWorkerSafely() {
      try {
        const proto = window.location.protocol;
        if (proto !== 'http:' && proto !== 'https:') return;
        if (!('serviceWorker' in navigator)) return;
        const swUrl = new URL('./service-worker.js', window.location.href).href;
        if (swUrl.startsWith('http://') || swUrl.startsWith('https://')) {
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (_e) {}
    }

    let WeatherInfo = {
      live: false,
      status: 'Awaiting Open-Meteo sync',
      location: AppState.profile.district || 'Agra, UP',
      temp: 26,
      humidity: 56,
      wind: 10,

        { day: 'Sun', max: 28, min: 15, rain: 5 },
        { day: 'Mon', max: 27, min: 14, rain: 10 }
      ]
    };

    function describeWeatherCode(code) {
      if (code === 0) return 'Clear Sky';
      if (code <= 3) return 'Partly Cloudy';
      if (code <= 48) return 'Fog / Mist';
      if (code <= 67) return 'Rain / Showers';
      if (code <= 82) return 'Rain Showers';
      if (code >= 95) return 'Thunderstorm Watch';
      return 'Mixed Conditions';
    }

    async function loadWeatherByCoords(lat, lon, label) {
      WeatherInfo.location = label;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,relative_humidity_2m,precipitation_probability,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Open-Meteo response error');
        const json = await res.json();
        if (!json || !json.current) throw new Error('Missing current weather');

        WeatherInfo.temp = Math.round(json.current.temperature_2m);
        WeatherInfo.humidity = Math.round(json.current.relative_humidity_2m ?? 55);
        WeatherInfo.wind = Math.round(json.current.wind_speed_10m ?? 10);
        WeatherInfo.rainProb = Math.round(json.current.precipitation_probability ?? (json.daily?.precipitation_probability_max?.[0] ?? 10));
        WeatherInfo.code = json.current.weather_code ?? 1;
        WeatherInfo.live = true;
        WeatherInfo.status = 'Live Open-Meteo Telemetry';

        if (json.daily && Array.isArray(json.daily.time)) {
          WeatherInfo.days = json.daily.time.slice(0, 7).map((iso, idx) => {
            const dt = new Date(iso + 'T00:00:00');
            const dName = isNaN(dt.getTime()) ? `Day ${idx + 1}` : dt.toLocaleDateString('en-IN', { weekday: 'short' });
            return {
              day: dName,
              max: Math.round(json.daily.temperature_2m_max?.[idx] ?? WeatherInfo.temp + 2),
              min: Math.round(json.daily.temperature_2m_min?.[idx] ?? WeatherInfo.temp - 8),
              rain: Math.round(json.daily.precipitation_probability_max?.[idx] ?? 10)
            };
          });
        }
      } catch (_err) {
        WeatherInfo.live = false;
        WeatherInfo.status = 'Offline / Unreachable — Fallback Estimate (Not Live Telemetry)';
      }

      if (AppState.activeModule === 'home' || AppState.activeModule === 'weather') {
        renderCurrentModule();
      }
    }

    function buildStructuredExpertPrompt() {
      const p = AppState.profile || {};
      const focus = document.getElementById('exp-focus')?.value || 'Balanced Crop & Soil Plan';
      const crop = document.getElementById('exp-crop')?.value || 'Wheat';
      const soil = p.soilType || 'Loamy / Alluvial';
      const water = p.water || 'Tubewell + Canal';
      const dist = p.district || 'India';
      const hi = AppState.lang === 'hi';

      const built = hi
        ? `${crop} (${dist}, मिट्टी: ${soil}, सिंचाई: ${water}) के लिए ${focus} पर व्यावहारिक सलाह दें। बीज, खाद/मिट्टी स्वास्थ्य, सिंचाई और सुरक्षित IPM की जानकारी दें।`
        : `Provide practical guidance on ${focus} for ${crop} in ${dist} (Soil: ${soil}, Water: ${water}), covering seed, soil/nutrient balance, irrigation, and safe IPM.`;

      const inp = document.getElementById('expert-input');
      if (inp) {
        inp.value = built;
        inp.focus();
      }
      showToast(hi ? 'सलाह प्रश्न तैयार किया गया' : 'Structured prompt inserted', 'info');
    }

    function generateAgronomyAdvisory(question) {
      const q = String(question || '').toLowerCase();
      const p = AppState.profile || {};
      const ctx = `${p.district || 'your region'} (${p.soilType || 'loamy soil'}, ${p.water || 'irrigation'})`;

      if (q.includes('organic') || q.includes('जैविक') || q.includes('compost') || q.includes('खाद') || q.includes('manure')) {
        return `Organic & Soil Fertility Advisory (${ctx}): Incorporate well-decomposed FYM, vermicompost, or green manure legumes ahead of sowing and use appropriate bio-fertilizers. Confirm site-specific quantities with your local KVK or soil laboratory.`;
      }
      if (q.includes('irrigat') || q.includes('सिंचाई') || q.includes('water') || q.includes('पानी')) {
        return `Irrigation Guidance (${ctx}): Irrigate during sensitive growth stages (such as CRI, flowering, and grain/pod filling) and check moisture at root depth first. Avoid spraying or heavy irrigation right before forecast rain.`;
      }
      if (q.includes('pest') || q.includes('disease') || q.includes('कीट') || q.includes('रोग') || q.includes('ipm') || q.includes('spray')) {
        return `IPM & Crop Protection Safety (${ctx}): Scout fields regularly, use cultural sanitation/traps where suitable, and never invent chemical dosages or mix unverified chemicals. Always read approved product labels and consult a local KVK or agriculture officer.`;
      }
      if (q.includes('crop') || q.includes('फसल') || q.includes('seed') || q.includes('बीज') || q.includes('calendar')) {
        return `Crop & Calendar Advisory (${ctx}): Select season-appropriate, KVK-recommended varieties suited to your soil and water availability, test germination/seed health, and follow timely sowing and weeding milestones.`;
      }
      return `Krishi Advisory (${ctx}): Prioritize soil health testing, quality seed suited to your season, timely weed control, and water-smart scheduling. Ask a targeted question in Hindi or English, and consult your local KVK specialist for field-specific recommendations.`;
    }

    async function sendExpertMessage() {
      const inp = document.getElementById('expert-input');
      if (!inp) return;
      const text = inp.value.trim();
      if (!text) {
        showToast('Please enter or speak a question first.', 'warning');
        return;
      }

      AppState.expertMessages.push({
        role: 'user',
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      inp.value = '';
      persistState();
      renderCurrentModule();

      let reply = '';
      const endpoint = (AppState.workerEndpoint || '').trim();
      if (endpoint) {
        try {
          const r = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text, lang: AppState.lang, profile: AppState.profile })
          });
          if (r.ok) {
            const data = await r.json();
            reply = data.reply || data.text || '';
          }
        } catch (_e) {
          reply = '';
        }
      }

      if (!reply) {
        reply = generateAgronomyAdvisory(text);
      }

      AppState.expertMessages.push({
        role: 'ai',
        text: reply,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      persistState();
      renderCurrentModule();
    }

    /* --- 6.4 ALL 12 SMART FARMING CALCULATORS (`calculators`) --- */
    function computeAll12Calculators() {
      const num = (id, fb = 0) => {
        const el = document.getElementById(id);
        const v = parseFloat(el ? el.value : fb);
        return Number.isFinite(v) && v >= 0 ? v : fb;
      };
      const put = (id, html) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = html;
      };

      // 1. Acre <-> Hectare
      const ac1 = num('calc1-acres', 2.5);
      put('calc1-res', `<strong>${(ac1 * 0.404686).toFixed(3)} Hectares</strong> (${(ac1 * 4046.86).toFixed(0)} m²) • 1 Ha = 2.471 Acres`);

      // 2. Bigha <-> Acre (State factor)
      const bg2 = num('calc2-bigha', 10);
      const fac2 = num('calc2-factor', 0.625);
      const ac2 = bg2 * fac2;
      put('calc2-res', `<strong>${ac2.toFixed(3)} Acres</strong> (${(ac2 * 0.404686).toFixed(3)} Ha). Local Bigha size varies by state/district.`);

      // 3. Seed Requirement (with germination/purity adjustment)
      const ar3 = num('calc3-area', 2);
      const rt3 = num('calc3-rate', 40);
      const germ3 = Math.min(100, Math.max(40, num('calc3-germ', 85)));
      const seedKg = (ar3 * rt3) * (85 / germ3);
      put('calc3-res', `Adjusted Seed Need: <strong>${seedKg.toFixed(2)} kg</strong> (normalized for ${germ3}% germination/viability).`);

      // 4. Fertilizer (NPK -> Urea ~46% N, DAP ~18% N & 46% P2O5, MOP ~60% K2O)
      const n4 = num('calc4-n', 48);
      const p4 = num('calc4-p', 24);
      const k4 = num('calc4-k', 16);
      const dap4 = p4 / 0.46;
      const remN4 = Math.max(0, n4 - dap4 * 0.18);
      const urea4 = remN4 / 0.46;
      const mop4 = k4 / 0.60;
      put('calc4-res', `Approx. <strong>Urea: ${urea4.toFixed(1)} kg</strong> • <strong>DAP: ${dap4.toFixed(1)} kg</strong> • <strong>MOP: ${mop4.toFixed(1)} kg</strong>. Follow Soil Health Card.`);

      // 5. Irrigation Requirement & Pumping Time
      const ar5 = num('calc5-area', 2);
      const mm5 = num('calc5-mm', 50);
      const lpm5 = Math.max(10, num('calc5-lpm', 480));
      const volL5 = ar5 * 4046.86 * mm5;
      const hrs5 = volL5 / (lpm5 * 60);
      put('calc5-res', `Volume: <strong>${Math.round(volL5).toLocaleString('en-IN')} L</strong> • Pump Runtime: <strong>${hrs5.toFixed(1)} hrs</strong>.`);

      // 6. Crop Production
      const ar6 = num('calc6-area', 3);
      const yld6 = num('calc6-yield', 18);
      const qtl6 = ar6 * yld6;
      put('calc6-res', `Estimated Output: <strong>${qtl6.toFixed(2)} Quintals</strong> (${(qtl6 * 0.1).toFixed(2)} Tonnes).`);

      // 7. Farming Cost
      const c7 = num('calc7-seed', 3000) + num('calc7-fert', 4500) + num('calc7-lab', 6000) + num('calc7-irr', 2200) + num('calc7-misc', 1500);
      put('calc7-res', `Total Farming Cost: <strong>₹${c7.toLocaleString('en-IN')}</strong>.`);

      // 8. Expected Profit & ROI
      const rev8 = num('calc8-qtl', 50) * num('calc8-price', 2350);
      const cost8 = num('calc8-cost', 45000);
      const prof8 = rev8 - cost8;
      const roi8 = cost8 > 0 ? ((prof8 / cost8) * 100).toFixed(1) : '0.0';
      put('calc8-res', `Gross: <strong>₹${rev8.toLocaleString('en-IN')}</strong> • Net: <strong class="${prof8 >= 0 ? 'text-agri-700' : 'text-rose-600'}">₹${prof8.toLocaleString('en-IN')}</strong> • ROI: <strong>${roi8}%</strong>.`);

      // 9. Seasonal Water Requirement
      const ar9 = num('calc9-area', 2);
      const mm9 = num('calc9-mm', 450);
      const lit9 = ar9 * 4046.86 * mm9;
      put('calc9-res', `Seasonal Water Need: <strong>${(lit9 / 100000).toFixed(2)} Lakh Liters</strong> (${(lit9 / 1000).toFixed(0).toLocaleString('en-IN')} m³).`);

      // 10. Spray Dilution (Label & PPE notice)
      const tank10 = num('calc10-tank', 200);
      const rate10 = num('calc10-rate', 2);
      const ml10 = tank10 * rate10;
      put('calc10-res', `Mix <strong>${ml10.toFixed(0)} ml</strong> (${(ml10 / 1000).toFixed(2)} L) in <strong>${tank10} L</strong> water. <em>Follow label dose & wear PPE.</em>`);

      // 11. Plant Spacing & Plant Population
      const ar11 = num('calc11-area', 1);
      const row11 = Math.max(5, num('calc11-row', 45));
      const plt11 = Math.max(5, num('calc11-plant', 20));
      const pop11 = (ar11 * 4046.86) / ((row11 / 100) * (plt11 / 100));
      put('calc11-res', `Estimated Stand: <strong>${Math.round(pop11).toLocaleString('en-IN')} plants</strong> (excluding bunds/headlands).`);

      // 12. Tractor & Machinery Cost
      const hrs12 = num('calc12-hrs', 6);
      const rate12 = num('calc12-hr-cost', 650);
      const tot12 = hrs12 * rate12;
      put('calc12-res', `Estimated Machinery Cost: <strong>₹${tot12.toLocaleString('en-IN')}</strong> (${hrs12} hrs × ₹${rate12}/hr).`);
    }

      const item = AppState.weatherReadinessLog.find((x) => x.id === id);
      if (!item) return;
      item.done = !item.done;
      persistState();
      if (item.done) celebrateMilestone(5, 'Weather readiness step completed');
      renderCurrentModule();
    }

    function addWeatherReadinessNote(ev) {
      ev.preventDefault();
      const condEl = document.getElementById('wr-cond');
      const actEl = document.getElementById('wr-act');
      const condition = (condEl?.value || 'Field Weather Note').trim();
      const action = (actEl?.value || '').trim();
      if (!action) {
        showToast('Please enter a weather/irrigation readiness note.', 'warning');
        return;
      }
      AppState.weatherReadinessLog.unshift({
        id: 'wr_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        condition,
        action,
        done: false
      });
      if (actEl) actEl.value = '';      persistState();
      celebrateMilestone(5, 'Weather readiness log added');
      renderCurrentModule();
    }

    function renderMandiTrendChart() {
      try {
        const c = document.getElementById('mandi-chart');
        if (!c) return;
        const ctx = c.getContext('2d');
        c.width = Math.max(260, (c.parentElement ? c.parentElement.clientWidth - 24 : 520));
        c.height = 165;

        const row = DEMO_MANDI_DATA.find((x) => x.id === mandiChartId) || DEMO_MANDI_DATA[0];
        const pts = row.trend;
        const minV = Math.min(...pts) * 0.98;
        const maxV = Math.max(...pts) * 1.02;
        const span = Math.max(1, maxV - minV);

        ctx.clearRect(0, 0, c.width, c.height);
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;
        ctx.beginPath();
        pts.forEach((v, idx) => {
          const x = 24 + (idx / Math.max(1, pts.length - 1)) * (c.width - 48);
          const y = c.height - 28 - ((v - minV) / span) * (c.height - 50);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        pts.forEach((v, idx) => {
          const x = 24 + (idx / Math.max(1, pts.length - 1)) * (c.width - 48);
          const y = c.height - 28 - ((v - minV) / span) * (c.height - 50);
          ctx.fillStyle = '#ca8a04';
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#64748b';
          ctx.font = '10px Inter, sans-serif';
          ctx.fillText(`₹${v}`, x - 14, y - 8);
        });
      } catch (_e) {}
    }

      AppState.financeLogs.unshift({

    function exportFinanceCsvFile() {
      const cols = ['Date', 'Month', 'Type', 'Category', 'Crop', 'Amount', 'Note'];
      const lines = AppState.financeLogs.map((r) => [r.date, r.month, r.type, r.category, r.crop, r.amount, r.note]);
      const csv = [cols, ...lines].map((row) => row.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Lavaniya_KrishiSaarthi_Finance.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Finance CSV exported.', 'success');
    }

    function computeDairyExpenseEstimate() {
      const animals = Math.max(1, parseFloat(document.getElementById('dy-calc-animals')?.value || '2') || 2);
      const feedPerDay = Math.max(0, parseFloat(document.getElementById('dy-calc-feed')?.value || '160') || 160);
      const milkPerDay = Math.max(0, parseFloat(document.getElementById('dy-calc-milk')?.value || '14') || 14);
      const ratePerL = Math.max(0, parseFloat(document.getElementById('dy-calc-rate')?.value || '45') || 45);
      const out = document.getElementById('dy-calc-out');
      if (!out) return;

      const monthlyCost = animals * feedPerDay * 30;
      const monthlyMilkRev = milkPerDay * ratePerL * 30;
      const monthlyNet = monthlyMilkRev - monthlyCost;
      out.innerHTML = `Monthly Est. Feed/Care: <strong>₹${monthlyCost.toLocaleString('en-IN')}</strong> • Est. Milk Value: <strong>₹${monthlyMilkRev.toLocaleString('en-IN')}</strong> • Net Margin: <strong class="${monthlyNet >= 0 ? 'text-agri-700' : 'text-rose-600'}">₹${monthlyNet.toLocaleString('en-IN')}</strong>/mo.`;
    }

    function submitLoanRecord(ev) {
      ev.preventDefault();

      const amount = parseFloat(document.getElementById('ln-amt')?.value);
      const dueNote = document.getElementById('ln-note')?.value.trim() || '';
      if (!Number.isFinite(amount) || amount <= 0) {
        showToast('Enter a valid loan/repayment amount.', 'warning');
        return;
      }
      if (!Array.isArray(AppState.loanRecords)) AppState.loanRecords = [];
      AppState.loanRecords.unshift({
        id: 'ln_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        lender,
        kind,
        amount,
        dueNote
      });
      persistState();
      celebrateMilestone(5, 'Loan / repayment record saved');
      renderCurrentModule();
    }
    function computeNutrientCrossCheck() {
      const ureaBags = Math.max(0, parseFloat(document.getElementById('xc-urea')?.value || '0') || 0);
      const dapBags = Math.max(0, parseFloat(document.getElementById('xc-dap')?.value || '0') || 0);
      const mopBags = Math.max(0, parseFloat(document.getElementById('xc-mop')?.value || '0') || 0);
      const out = document.getElementById('xc-nut-out');
      if (!out) return;

      const nKg = ureaBags * 45 * 0.46 + dapBags * 50 * 0.18;
      const pKg = dapBags * 50 * 0.46;
      const kKg = mopBags * 50 * 0.60;
      out.innerHTML = `Approx. supplied: <strong>N: ${nKg.toFixed(1)} kg</strong> • <strong>P2O5: ${pKg.toFixed(1)} kg</strong> • <strong>K2O: ${kKg.toFixed(1)} kg</strong>. Always match with your Soil Health Card & split-dose schedule.`;
    }

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify(AppState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lavaniya_krishisaarthi_backup.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('JSON backup downloaded.', 'success');
    }

    function restoreJsonBackup(input) {      const file = input && input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(String(ev.target?.result || ''));
          if (!parsed || typeof parsed !== 'object') throw new Error('Invalid JSON');
          AppState = { ...createInitialState(), ...parsed };
          persistState();
          applyVisualTheme();
          applyLanguageTexts();
          renderNavigation();
          renderCurrentModule();
          showToast('Backup restored.', 'success');
        } catch (_err) {
          showToast('Invalid JSON backup file.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function downloadAppHtml() {
      try {
        const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('index.html downloaded.', 'success');
      } catch (_e) {
        showToast('HTML download blocked in this frame.', 'warning');
      }
    }

              <button onclick="AppState.adminUnlocked=false; persistState(); renderCurrentModule();" class="px-3.5 py-2 rounded-xl bg-rose-600 text-white font-bold">Lock</button>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-3">
            <h3 class="font-extrabold text-sm">Announcements, Endpoints & PIN</h3>
            <div>
              <label class="block font-bold mb-1">Announcement</label>
              <input id="adm-ann" type="text" value="${escapeHtml(AppState.announcement)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block font-bold mb-1">Cloudflare Worker URL (No secret keys here)</label>
                <input id="adm-worker" type="url" value="${escapeHtml(AppState.workerEndpoint)}" placeholder="https://your-worker.workers.dev" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              </div>
              <div>
                <label class="block font-bold mb-1">Agmarknet Proxy URL (Optional)</label>
                <input id="adm-agmark" type="url" value="${escapeHtml(AppState.agmarknetEndpoint || '')}" placeholder="https://your-proxy/agmarknet" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              </div>
              <div>
                <label class="block font-bold mb-1">New Admin PIN (4+ chars)</label>
                <input id="adm-pin-new" type="password" placeholder="Optional new PIN" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              </div>
            </div>
            <button onclick="saveAdminConfig()" class="px-4 py-2 rounded-xl bg-agri-700 text-white font-extrabold">Save Admin Settings</button>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-2">
            <h3 class="font-extrabold text-sm">Module Toggles</h3>
            <div class="flex flex-wrap gap-2">
              ${NAV_MODULES.filter((m) => m.id !== 'home' && m.id !== 'admin' && m.id !== 'audit').map((m) => {
                const active = !AppState.disabledModules.includes(m.id);
                return `
                  <button onclick="toggleModuleState('${m.id}')" class="px-3 py-1.5 rounded-xl border font-bold ${active ? 'bg-agri-50 dark:bg-agri-950 border-agri-400 text-agri-800 dark:text-agri-200' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">
                    ${escapeHtml(m.en)}: ${active ? 'ON' : 'OFF'}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* --- 6.17 10-POINT SYSTEM AUDIT & SETUP SUITE (`audit`) --- */
    let LastAuditReport = null;

    function runTenPointAuditSuite() {
      const checks = [];
      const add = (num, title, ok, detail) => checks.push({ num, title, status: ok ? 'PASS' : 'CHECK', detail });

      add(1, 'Navigation & Routing', Array.isArray(NAV_MODULES) && NAV_MODULES.length >= 17 && typeof switchModule === 'function', '17 navigation targets wired across sidebar, bottom bar, header & modal.');
      add(2, 'All 12 Smart Farming Calculators', typeof computeAll12Calculators === 'function' && (2.5 * 0.404686).toFixed(2) === '1.01', 'All 12 calculators verified including area, Bigha, seed, NPK, irrigation, yield, cost, profit, water, spray, spacing & tractor.');
      add(3, 'Forms, Escaping & Validation', typeof escapeHtml === 'function' && typeof submitFinanceEntry === 'function', 'Input escaping & numeric/required checks active across forms.');
      add(4, 'Bilingual (EN/HI) & 5 Themes', (AppState.lang === 'en' || AppState.lang === 'hi') && typeof setTheme === 'function', `Current: ${AppState.lang.toUpperCase()} • Theme: ${AppState.theme} • Dark: ${AppState.darkMode ? 'Yes' : 'No'}.`);
      add(5, 'Mobile Responsiveness', Boolean(document.querySelector('meta[name="viewport"]')) && window.innerWidth > 0, `Viewport width ${window.innerWidth}px with mobile-first responsive grids.`);
      add(6, 'Offline Storage & Safe SW Guard', typeof safeStorage !== 'undefined' && typeof syncIndexedDbMirror === 'function', `${idbStatusText}; no blob: Service Worker registration.`);
      add(7, 'Save / Backup / Restore', typeof downloadJsonBackup === 'function' && typeof restoreJsonBackup === 'function' && typeof downloadAppHtml === 'function', 'JSON backup/restore & standalone index.html download verified.');
      add(8, 'Dashboard & State Sync', Boolean(document.getElementById('app')) && typeof renderHomeModule === 'function', 'Dashboard rendered with weather, sample mandi, tasks, schemes & helplines.');
      add(9, 'AI & API Safety / Error Boundaries', typeof generateAgronomyAdvisory === 'function' && typeof runDoctorGuidance === 'function', 'Safety disclaimers, label/KVK guidance & try/catch error boundaries active.');
      add(10, 'Admin PIN & Secret Hygiene', Boolean(AppState.adminPin) && typeof verifyAdminPin === 'function', 'PIN gate active for Mahesh Lavaniya; zero secret API keys hardcoded in client.');

      LastAuditReport = {
        ranAt: new Date().toLocaleString('en-IN'),
        passCount: checks.filter((c) => c.status === 'PASS').length,
        total: checks.length,
        checks
      };
      renderCurrentModule();
      celebrateMilestone(15, `10-Point Audit: ${LastAuditReport.passCount}/${LastAuditReport.total} PASS`);
    }

    function exportAuditTxtReport() {
      if (!LastAuditReport) runTenPointAuditSuite();
      const content = [
        'LAVANIYA KRISHISAARTHI — 10-POINT SYSTEM AUDIT REPORT',
        'Tagline: Smart Farming | Better Crops | Higher Income | Owner: Mahesh Lavaniya',
        `Ran At: ${LastAuditReport.ranAt}`,
        `Result: ${LastAuditReport.passCount}/${LastAuditReport.total} PASS`,
        '',
        ...LastAuditReport.checks.map((c) => `[${c.status}] ${c.num}. ${c.title} — ${c.detail}`)
      ].join('\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Lavaniya_KrishiSaarthi_Audit.txt';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Audit .txt report downloaded.', 'success');
    }

    function renderAuditModule() {
      const workerSnippet = `export default {
  async fetch(request, env) {
    // Store GEMINI_API_KEY in Cloudflare Worker secrets (never in HTML)
    const headers = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type' };
    if (request.method === 'OPTIONS') return new Response(null, { headers });
    const { prompt } = await request.json();
    const apiRes = await fetch(\`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=\${env.GEMINI_API_KEY}\`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await apiRes.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    return new Response(JSON.stringify({ reply }), { headers: { ...headers, 'Content-Type': 'application/json' } });
  }
};`;

      return `
        <div class="space-y-4 text-xs">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-xl font-black"><i class="fa-solid fa-clipboard-check text-agri-700 mr-1.5"></i>10-Point System Audit & Deployment Guide</h2>
              <p class="text-slate-500">Run live checks + Firebase, Cloudflare Worker, API & GitHub Pages notes.</p>
            </div>
            <div class="flex flex-wrap gap-2 font-bold">
              <button onclick="runTenPointAuditSuite()" class="px-4 py-2 rounded-xl bg-agri-700 text-white"><i class="fa-solid fa-play mr-1"></i>Run 10-Point Audit</button>
              <button onclick="exportAuditTxtReport()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-white"><i class="fa-solid fa-download mr-1"></i>Download .TXT</button>
              <button onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-indigo-700 text-white"><i class="fa-solid fa-print mr-1"></i>Print</button>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="font-extrabold text-sm">10-Point Audit Checklist</h3>
              ${LastAuditReport
                ? `<span class="px-3 py-1 rounded-full bg-agri-100 text-agri-800 font-extrabold">${LastAuditReport.passCount}/${LastAuditReport.total} PASS • ${escapeHtml(LastAuditReport.ranAt)}</span>`
                : `<span class="text-slate-500">Click "Run 10-Point Audit" to execute checks.</span>`
              }
            </div>
            ${LastAuditReport ? LastAuditReport.checks.map((c) => `
              <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 flex items-start justify-between gap-2">
                <div>
                  <div class="font-extrabold">${c.num}. ${escapeHtml(c.title)}</div>
                  <div class="text-slate-500">${escapeHtml(c.detail)}</div>
                </div>
                <span class="px-2 py-0.5 rounded-full bg-agri-100 text-agri-800 font-extrabold text-[10px] shrink-0">${c.status}</span>
              </div>
            `).join('') : ''}
          </div>

          <!-- Live Storage & Sync Diagnostics Table -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-2.5">
            <h3 class="font-extrabold text-sm"><i class="fa-solid fa-database text-indigo-700 mr-1.5"></i>Storage & Sync Diagnostics</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-500">
                    <th class="py-1.5 pr-3 font-extrabold">Diagnostic Item</th>
                    <th class="py-1.5 px-2 font-extrabold">Current Status / Count</th>
                    <th class="py-1.5 pl-2 font-extrabold">Persistence Layer</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  <tr>
                    <td class="py-1.5 pr-3 font-bold">Primary Storage Key</td>
                    <td class="py-1.5 px-2 font-mono text-[11px]">${escapeHtml(APP_STATE_KEY)}</td>
                    <td class="py-1.5 pl-2">${escapeHtml(idbStatusText)}</td>
                  </tr>
                  <tr>
                    <td class="py-1.5 pr-3 font-bold">Theme & Language</td>
                    <td class="py-1.5 px-2">${escapeHtml(AppState.theme)} • ${AppState.darkMode ? 'Dark' : 'Light'} • ${AppState.lang.toUpperCase()}</td>
                    <td class="py-1.5 pl-2">safeStorage + AppState</td>
                  </tr>
                  <tr>
                    <td class="py-1.5 pr-3 font-bold">Farmer Profile & Kisan Pts</td>
                    <td class="py-1.5 px-2">${escapeHtml(AppState.profile?.name || 'Not set (Kisan)')} • ${Number(AppState.kisanPoints) || 0} pts</td>
                    <td class="py-1.5 pl-2">safeStorage + LavaniyaKrishiDB</td>
                  </tr>
                  <tr>
                    <td class="py-1.5 pr-3 font-bold">Saved Records</td>
                    <td class="py-1.5 px-2">${AppState.crops.length} crops (${AppState.offlineCrops.length} offline) • ${AppState.financeLogs.length} finance • ${(AppState.loanRecords || []).length} loans • ${AppState.calendarItems.length} tasks • ${AppState.communityPosts.length} posts • ${AppState.dairyLogs.length} dairy</td>
                    <td class="py-1.5 pl-2">IndexedDB Mirror Active</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-2">
              <h3 class="font-extrabold text-sm">Cloudflare Worker Template</h3>
              <pre class="p-3 rounded-xl bg-slate-950 text-emerald-300 text-[11px] overflow-x-auto">${escapeHtml(workerSnippet)}</pre>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800 space-y-2 leading-relaxed">
              <h3 class="font-extrabold text-sm">Firebase, API & GitHub Pages Setup</h3>
              <p><strong>Firebase:</strong> Enable Auth, Firestore & Storage; restrict user records to authenticated owner UIDs.</p>
              <p><strong>GitHub Pages:</strong> Push <code>index.html</code> to your repository and enable GitHub Pages over HTTPS.</p>
              <p><strong>API Keys:</strong> Keep Gemini / Agmarknet API keys in Worker/server environment secrets—never in frontend HTML.</p>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       7. DEFENSIVE STARTUP ENTRYPOINT
       ========================================================================= */
    function initKrishiSaarthiApp() {
      try {
        applyVisualTheme();
        applyLanguageTexts();
        renderNavigation();
        renderCurrentModule();
        syncIndexedDbMirror(AppState);
        registerServiceWorkerSafely();
        syncWeatherWithProfile();
      } catch (err) {
        showDiagnostic(`Startup notice: ${err && err.message ? err.message : 'Fallback initialized'}`);
        try {
          const vp = document.getElementById('module-viewport');
          if (vp && !vp.innerHTML.trim()) vp.innerHTML = renderHomeModule();
        } catch (_e) {}
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initKrishiSaarthiApp, { once: true });
    } else {
      initKrishiSaarthiApp();
    }
  </script>
</body>
