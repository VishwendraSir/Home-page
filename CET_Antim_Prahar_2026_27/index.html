function study(){return `<h2>Study Library</h2><input id="find" placeholder="विषय खोजें..." oninput="filter(this.value)"><div id="mlist" class="grid">${modules.map(tile).join('')}</div><h2>PDF से निकाले गए मुख्य तथ्य</h2><div class="grid">${facts.map(f=>`<div class="card"><span class="tag">PDF PAGE ${f[2]}</span><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join('')}</div>`}
function filter(v){document.getElementById('mlist').innerHTML=modules.filter(m=>m.join(' ').toLowerCase().includes(v.toLowerCase())).map(tile).join('')}
function module(id){let m=modules.find(x=>x[0]===id);let f=facts.filter(x=>(id==='survey'&&[11,13,14,18].includes(x[2]))||(id==='industry'&&[15,16].includes(x[2]))||(id==='tourism'&&x[2]===16)||(id==='energy'&&x[2]===18)||(id==='projects'&&x[2]===29)||(id==='gi'&&x[2]===34)||(id==='military'&&x[2]===37));root.innerHTML=`<button class="alt" onclick="go('study')">← Study Library</button><div class="card" style="margin-top:12px"><span class="tag">PDF PAGE ${m[2]} • ${m[5]==='verify'?'VERIFICATION REQUIRED':'SOURCE NOTES'}</span><h2>${m[1]}</h2><p>${m[4]}</p>${f.map(x=>`<div class="note"><b>${x[0]}</b><p>${x[1]}</p><small>PDF पृष्ठ ${x[2]}</small></div>`).join('')}<button onclick="startTopic('${id}')">इस विषय का टेस्ट</button></div>`}
function start(n){active=qs.slice(0,Math.min(n,qs.length));idx=0;pick=-1;done=false;go('quiz')}
function startTopic(id){let pageMap={survey:[11,13,14,18],industry:[15,16],tourism:[16],energy:[18],projects:[29],gi:[34],military:[37]};active=qs.filter(q=>(pageMap[id]||[]).includes(q[5]));if(!active.length){alert('इस विषय के MCQ अभी सत्यापन/निर्माण में हैं।');return}idx=0;pick=-1;done=false;go('quiz')}
function quiz(){if(!active.length)return `<div class="card"><h2>Practice Test</h2><p>अभी उपलब्ध ${qs.length} प्रश्नों से अभ्यास करें।</p><button onclick="start(25)">Start Test</button></div>`;let q=active[idx];return `<div class="card"><div class="row"><span class="tag">QUESTION ${idx+1}/${active.length}</span><span class="sp"></span><button class="alt" onclick="bookmark()">${saved.includes(idx)?'★ Saved':'☆ Save'}</button></div><div class="bar"><i style="width:${(idx+1)/active.length*100}%"></i></div><div class="q">${q[0]}</div>${q[1].map((o,i)=>`<button class="opt ${pick===i?'sel':''} ${done&&i===q[2]?'ok':''} ${done&&pick===i&&pick!==q[2]?'no':''}" ${done?'disabled':''} onclick="choose(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}${done?`<div class="note"><b>${pick===q[2]?'✓ सही उत्तर':'✕ गलत उत्तर'}</b><p>${q[3]}</p><small>Source: Uploaded PDF, page ${q[5]}</small></div>`:''}<div class="row"><button class="alt" onclick="prev()" ${idx===0?'disabled':''}>Previous</button><span class="sp"></span>${done?`<button onclick="next()">${idx===active.length-1?'Finish':'Next'}</button>`:`<button onclick="submit()" ${pick<0?'disabled':''}>Submit</button>`}</div></div>`}
function choose(i){if(done)return;pick=i;render()}function submit(){if(pick<0||done)return;done=true;stats.attempt++;if(pick===active[idx][2])stats.right++;else{stats.wrong++;wrong.push(active[idx][0])}localStorage.cetStats=JSON.stringify(stats);localStorage.cetWrong=JSON.stringify(wrong);render()}function next(){if(idx<active.length-1){idx++;pick=-1;done=false;render()}else{root.innerHTML=`<div class="card"><h2>Test Complete</h2><p>आपने ${active.length} प्रश्न पूरे किए।</p><button onclick="go('home')">Dashboard</button></div>`;active=[]}}function prev(){if(idx){idx--;pick=-1;done=false;render()}}function bookmark(){let k=active[idx][0];saved=saved.includes(k)?saved.filter(x=>x!==k):[...saved,k];localStorage.cetSaved=JSON.stringify(saved);render()}
function report(){let acc=stats.attempt?Math.round(stats.right/stats.attempt*100):0;return `<div class="grid"><div class="card"><span class="muted">Attempted</span><h2>${stats.attempt}</h2></div><div class="card"><span class="muted">Correct</span><h2>${stats.right}</h2></div><div class="card"><span class="muted">Accuracy</span><h2>${acc}%</h2></div><div class="card"><span class="muted">Bookmarks</span><h2>${saved.length}</h2></div></div><div class="card"><h3>Data & Update Notes</h3><p class="muted">Offline local progress is enabled. Firebase sync, authenticated admin publishing and scheduled daily source fetching are not connected in this static GitHub Pages release.</p><p class="muted">Modules marked verification required must be checked against the original PDF / official sources before adding them to exam tests.</p></div>`}
function render(){root.innerHTML=page==='home'?home():page==='study'?study():page==='quiz'?quiz():report()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.p));document.getElementById('theme').onchange=e=>document.body.dataset.t=e.target.value;window.start=start;window.module=module;window.startTopic=startTopic;window.choose=choose;window.submit=submit;window.next=next;window.prev=prev;window.bookmark=bookmark;window.filter=filter;window.go=go;render();
</script></body></html>
