bullets_hi":["RPSC ने वरिष्ठ अध्यापक (माध्यमिक शिक्षा) प्रतियोगी परीक्षा-2025 का कार्यक्रम जारी किया।","परीक्षाएँ 12–18 जुलाई 2026 के लिए निर्धारित थीं; कुल 6,500 पद 10 विषयों में बताए गए।","विज्ञप्ति में विषयवार पदों में गणित 1,385 और विज्ञान 1,355 शामिल थे।"],"bullets_en":["RPSC released the schedule for the Senior Teacher (Secondary Education) Competitive Examination 2025.","Examinations were scheduled for 12–18 July 2026; 6,500 posts across 10 subjects were reported.","The subject-wise list included 1,385 Mathematics and 1,355 Science posts."],"exam_focus":"RPSC • वरिष्ठ अध्यापक • विषयवार पद • परीक्षा तिथियाँ","source_title":"DIPR Rajasthan — RPSC schedule, 26 May 2026","source_url":"https://dipr.rajasthan.gov.in/press-release-detail/242292/85","verification":"Official-source verified","note":""},{"id":"may-india-cabinet","type":"news","month":"May 2026","date":"2026-05-05","region":"India","category":"Cabinet & Manufacturing / मंत्रिमंडल एवं विनिर्माण","title_hi":"मई में केंद्रीय मंत्रिमंडल के प्रमुख निर्णय","title_en":"Key Union Cabinet decisions in May","bullets_hi":["5 मई की कैबिनेट सूची में सुप्रीम कोर्ट के न्यायाधीशों की संख्या बढ़ाने का प्रस्ताव, Mission for Cotton Productivity, दो सेमीकंडक्टर इकाइयाँ और Emergency Credit Line Guarantee Scheme 5.0 शामिल थे।","13 मई की सूची में खरीफ विपणन सत्र 2026-27 के लिए MSP निर्णय तथा Surface Coal/Lignite Gasification Scheme भी दर्ज है।"],"bullets_en":["The 5 May Cabinet list included an increase in Supreme Court judge strength, Mission for Cotton Productivity, two semiconductor units and Emergency Credit Line Guarantee Scheme 5.0.","The 13 May list also recorded MSP decisions for Kharif Marketing Season 2026-27 and the Surface Coal/Lignite Gasification Scheme."],"exam_focus":"कैबिनेट निर्णय • कपास • सेमीकंडक्टर • MSP • न्यायपालिका","source_title":"PIB — Cabinet Decisions archive","source_url":"https://www.pib.gov.in/EventDetail.aspx?ID=1234&lang=1&reg=3","verification":"Official-source verified","note":"यह मासिक Cabinet Decisions index है; प्रत्येक निर्णय की विस्तृत शर्तें मूल release में देखें।"},{"id":"may-kharif-msp","type":"news","month":"May 2026","date":"2026-05-13","region":"India","category":"Agriculture & MSP / कृषि एवं MSP","title_hi":"खरीफ 2026-27 की 14 फसलों के MSP में वृद्धि","title_en":"MSP increased for 14 Kharif crops for 2026-27","bullets_hi":["13 मई को CCEA ने खरीफ विपणन सत्र 2026-27 के लिए 14 फसलों के MSP बढ़ाने को मंजूरी दी।","सबसे अधिक पूर्ण वृद्धि सूरजमुखी बीज में ₹622/क्विंटल; इसके बाद कपास ₹557, नाइजरसीड ₹515 और तिल ₹500।","किसी फसल की MSP दर याद करते समय मूल PIB तालिका से crop-wise मूल्य मिलाएँ।"],"bullets_en":["On 13 May, the CCEA approved higher MSPs for 14 crops for Kharif Marketing Season 2026-27.","The highest absolute increase was for sunflower seed at ₹622/quintal, followed by cotton ₹557, nigerseed ₹515 and sesamum ₹500.","Check the original PIB table for crop-wise MSP values before memorising them."],"exam_focus":"Kharif MSP • CCEA • sunflower • cotton • nigerseed","source_title":"PIB — Kharif MSP 2026-27, 13 May 2026","source_url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260618&lang=2&reg=48","verification":"Official-source verified","note":""},{"id":"may-global-ebola","type":"news","month":"May 2026","date":"2026-05-17","region":"International","category":"Global Health / वैश्विक स्वास्थ्य","title_hi":"WHO ने Bundibugyo Ebola प्रकोप को PHEIC घोषित किया","title_en":"WHO declares Bundibugyo Ebola outbreak a PHEIC","bullets_hi":["15 मई 2026 को DRC और Uganda ने Bundibugyo virus disease outbreak की पुष्टि/घोषणा की।","17 मई को WHO Director-General ने इसे Public Health Emergency of International Concern (PHEIC) निर्धारित किया; WHO ने स्पष्ट किया कि यह pandemic emergency की श्रेणी नहीं थी।","उस समय licensed vaccine या specific therapeutics उपलब्ध नहीं थे; supportive care और cross-border surveillance पर जोर था।"],"bullets_en":["On 15 May 2026, the DRC and Uganda confirmed/declared an outbreak of Bundibugyo virus disease.","On 17 May, the WHO Director-General determined it to be a Public Health Emergency of International Concern (PHEIC); WHO stated it did not meet the criteria for a pandemic emergency.","At that time there was no licensed vaccine or specific therapeutic; supportive care and cross-border surveillance were emphasised."],"exam_focus":"WHO • Ebola virus disease • Bundibugyo species • DRC • Uganda","source_title":"WHO — PHEIC statement, 17 May 2026","source_url":"https://www.who.int/news/item/17-05-2026-epidemic-of-ebola-disease-in-the-democratic-republic-of-the-congo-and-uganda-determined-a-public-health-emergency-of-international-concern","verification":"Official-source verified","note":""},{"id":"divider-jun","type":"month-divider","month":"June 2026","date":"","region":"All","category":"Month Index","title_hi":"जून 2026 — मुख्य घटनाएँ","title_en":"JUNE 2026 — KEY DEVELOPMENTS","bullets_hi":["राजस्थान प्रथम • राष्ट्रीय • अंतरराष्ट्रीय","स्रोत-आधारित चयनित घटनाएँ"],"bullets_en":["Rajasthan first • National • International","Selected source-linked developments"],"exam_focus":"महीने की सभी स्लाइडें आगे देखें","source_title":"","source_url":"","verification":"Index","note":""},{"id":"jun-upper-canal","type":"news","month":"June 2026","date":"2026-06-07","region":"Rajasthan","category":"Water & Agriculture / जल एवं कृषि","title_hi":"अपर हाई लेवल कैनाल: बांसवाड़ा के 338 गांव","title_en":"Upper High Level Canal: 338 villages in Banswara","bullets_hi":["लगभग ₹2,500 करोड़ की परियोजना से बांसवाड़ा जिले के 338 गांवों की करीब 42,000 हेक्टेयर कृषि भूमि को lift irrigation से जल उपलब्ध कराने का लक्ष्य बताया गया।","परियोजना वागड़ क्षेत्र की सिंचाई और ग्रामीण अर्थव्यवस्था से जुड़ी है।"],"bullets_en":["The approximately ₹2,500-crore project was described as aiming to provide lift irrigation to around 42,000 hectares across 338 villages in Banswara district.","The project is linked to irrigation and the rural economy of the Vagad region."],"exam_focus":"बांसवाड़ा • वागड़ • लिफ्ट सिंचाई • जल संसाधन","source_title":"CMO Rajasthan — Upper High Level Canal project","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/243173","verification":"Official-source verified","note":""},{"id":"jun-solar","type":"news","month":"June 2026","date":"2026-06-16","region":"Rajasthan","category":"Renewable Energy / नवीकरणीय ऊर्जा","title_hi":"बीकानेर और फलोदी में सौर परियोजनाओं के लिए भूमि","title_en":"Land allocation for solar projects in Bikaner and Phalodi","bullets_hi":["राज्य सरकार ने बीकानेर में कुल 2,450 MW के तीन सौर पार्कों के लिए भूमि आवंटन प्रस्ताव स्वीकृत किए।","फलोदी जिले के भड़ला क्षेत्र में NTPC Renewable Energy के 500 MW सौर प्रोजेक्ट के लिए भी 910 हेक्टेयर भूमि आवंटन प्रस्ताव स्वीकृत हुआ।","विज्ञप्ति में परियोजनाओं से स्थानीय रोजगार और निवेश बढ़ने की संभावना बताई गई।"],"bullets_en":["The State Government approved land-allocation proposals for three solar parks totalling 2,450 MW in Bikaner.","A 910-hectare allocation proposal was also approved for NTPC Renewable Energy’s 500 MW solar project in the Bhadla area of Phalodi district.","The release cited potential local jobs and investment from the projects."],"exam_focus":"बीकानेर • फलोदी • सौर पार्क • NTPC Renewable Energy","source_title":"CMO Rajasthan — Solar project land allocation, 16 June 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/139399","verification":"Official-source verified","note":"2,450 MW और 500 MW अलग परियोजना समूह हैं; कुल क्षमता जोड़कर नहीं दी गई है।"},{"id":"jun-national-airline-fund","type":"news","month":"June 2026","date":"2026-06-03","region":"India","category":"Aviation & Cabinet / विमानन एवं मंत्रिमंडल","title_hi":"निर्धारित भारतीय एयरलाइनों के लिए Price Stabilization Fund","title_en":"Price Stabilization Fund for scheduled Indian airlines","bullets_hi":["3 जून की केंद्रीय कैबिनेट सूची में scheduled Indian airlines के लिए Price Stabilization Fund को मंजूरी दर्ज है।","परीक्षा के लिए इसे नागरिक उड्डयन और कैबिनेट नीति निर्णय के रूप में याद रखें; फंड की शर्तें मूल PIB release में देखें।"],"bullets_en":["The Union Cabinet list dated 3 June records approval of a Price Stabilization Fund for scheduled Indian airlines.","For exam revision, classify it under civil aviation and Cabinet policy decisions; consult the original PIB release for the fund’s detailed conditions."],"exam_focus":"नागरिक उड्डयन • केंद्रीय मंत्रिमंडल","source_title":"PIB — Cabinet Decisions archive, 3 June 2026","source_url":"https://www.pib.gov.in/EventDetail.aspx?ID=1234&lang=1&reg=3","verification":"Official-source verified","note":""},{"id":"jun-who-plan","type":"news","month":"June 2026","date":"2026-06-08","region":"International","category":"Global Health / वैश्विक स्वास्थ्य","title_hi":"WHO और Africa CDC की संयुक्त Ebola प्रतिक्रिया योजना","title_en":"WHO and Africa CDC launch joint continental Ebola response plan","bullets_hi":["5 जून को Africa CDC और WHO ने संयुक्त continental Ebola preparedness and response plan शुरू किया।","WHO की 8 जून situation update के अनुसार योजना के लिए US$518 million की सहायता अपील थी।","यह मई 2026 में DRC और Uganda में पुष्ट Bundibugyo outbreak के क्षेत्रीय response के लिए था।"],"bullets_en":["On 5 June, Africa CDC and WHO launched a joint continental Ebola preparedness and response plan.","WHO’s 8 June situation update stated that the plan sought US$518 million in support.","It was a regional response to the Bundibugyo outbreak confirmed in DRC and Uganda in May 2026."],"exam_focus":"WHO • Africa CDC • संक्रामक रोग प्रतिक्रिया","source_title":"WHO — Disease Outbreak News, 8 June 2026","source_url":"https://www.who.int/southeastasia/outbreaks-and-emergencies/disease-outbreak-news/item/2026-DON606","verification":"Official-source verified","note":""},{"id":"divider-jul","type":"month-divider","month":"July 2026","date":"","region":"All","category":"Month Index","title_hi":"जुलाई 2026 — मुख्य घटनाएँ","title_en":"JULY 2026 — KEY DEVELOPMENTS","bullets_hi":["राजस्थान प्रथम • राष्ट्रीय • अंतरराष्ट्रीय","स्रोत-आधारित चयनित घटनाएँ"],"bullets_en":["Rajasthan first • National • International","Selected source-linked developments"],"exam_focus":"महीने की सभी स्लाइडें आगे देखें","source_title":"","source_url":"","verification":"Index","note":""},{"id":"jul-yuva-suyog","type":"news","month":"July 2026","date":"2026-07-21","region":"Rajasthan","category":"Youth & Sports / युवा एवं खेल","title_hi":"मुख्यमंत्री युवा सुयोग प्लेटफॉर्म का शुभारंभ","title_en":"Mukhyamantri Yuva Suyog platform launched","bullets_hi":["21 जुलाई को मुख्यमंत्री युवा सुयोग प्लेटफॉर्म का शुभारंभ किया गया।","घोषित उद्देश्य युवाओं को खेल, कौशल विकास और रोजगार से जोड़ना तथा पंचायत और वार्ड स्तर पर युवा नेतृत्व विकसित करना था।","प्रारंभिक शुरुआत बगरू विधानसभा क्षेत्र और बारां जिले से बताई गई।"],"bullets_en":["The Mukhyamantri Yuva Suyog platform was launched on 21 July.","Its stated aim was to connect young people with sports, skill development and employment, and develop youth leadership at panchayat and ward level.","The initial rollout was reported from Bagru Assembly constituency and Baran district."],"exam_focus":"राजस्थान युवा नीति • खेल • कौशल विकास • रोजगार","source_title":"CMO Rajasthan — Mukhyamantri Yuva Suyog","source_url":"https://cmo.rajasthan.gov.in/programdetail/247322","verification":"Official-source verified","note":""},{"id":"jul-semicon","type":"news","month":"July 2026","date":"2026-07-15","region":"India","category":"Technology & Manufacturing / प्रौद्योगिकी एवं विनिर्माण","title_hi":"Semicon 2.0 और Mobile Phone Manufacturing Scheme","title_en":"Semicon 2.0 and Mobile Phone Manufacturing Scheme","bullets_hi":["15 जुलाई को केंद्रीय मंत्रिमंडल ने Semicon 2.0 को ₹1,27,500 करोड़ के कुल बजटीय परिव्यय के साथ मंजूरी दी।","उद्देश्य semiconductor design, manufacturing, advanced packaging, materials, equipment, research और talent development का व्यापक ecosystem बनाना है।","इसी तारीख को Mobile Phone Manufacturing Scheme और National Investment Policy for Urea-2026 भी कैबिनेट सूची में थीं।"],"bullets_en":["On 15 July, the Union Cabinet approved Semicon 2.0 with a total budget outlay of ₹1,27,500 crore.","It aims to build a wider ecosystem for semiconductor design, manufacturing, advanced packaging, materials, equipment, research and talent development.","The same date’s Cabinet list also included the Mobile Phone Manufacturing Scheme and National Investment Policy for Urea-2026."],"exam_focus":"सेमीकंडक्टर • इलेक्ट्रॉनिक्स विनिर्माण • उर्वरक नीति","source_title":"PIB — Semicon 2.0, 15 July 2026","source_url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2284784&lang=1&reg=48","verification":"Official-source verified","note":""},{"id":"jul-bhavya-rasayan","type":"news","month":"July 2026","date":"2026-07-24","region":"India","category":"Chemical Parks & Industry / रासायनिक पार्क एवं उद्योग","title_hi":"BHAVYA-Rasayan: तीन केमिकल पार्कों के लिए ₹3,030 करोड़","title_en":"BHAVYA-Rasayan: ₹3,030 crore for three chemical parks","bullets_hi":["24 जुलाई को केंद्रीय मंत्रिमंडल ने Bharat Audyogik Vikas Yojana Rasayan (BHAVYA-Rasayan) को मंजूरी दी।","तीन समर्पित chemical parks के लिए कुल ₹3,030 करोड़ का परिव्यय; अवधि FY 2026-27 से FY 2030-31।","केंद्र प्रति पार्क अधिकतम ₹1,000 करोड़ grant दे सकता है; राज्य का न्यूनतम योगदान ₹500 करोड़ प्रति पार्क बताया गया।"],"bullets_en":["On 24 July, the Union Cabinet approved Bharat Audyogik Vikas Yojana Rasayan (BHAVYA-Rasayan).","Total outlay: ₹3,030 crore for three dedicated chemical parks; duration FY 2026-27 to FY 2030-31.","The Centre may provide up to ₹1,000 crore per park, subject to a minimum State contribution of ₹500 crore per park."],"exam_focus":"BHAVYA-Rasayan • chemical parks • industrial infrastructure","source_title":"PIB — BHAVYA-Rasayan, 24 July 2026","source_url":"https://www.pib.gov.in/newsite/erelcontent.aspx?lang=2&reg=48&relid=291839","verification":"Official-source verified","note":""},{"id":"jul-surya-sarovar","type":"news","month":"July 2026","date":"2026-07-31","region":"India","category":"Renewable Energy & Storage / नवीकरणीय ऊर्जा एवं भंडारण","title_hi":"PM Surya Sarovar: 5,000 MW floating solar लक्ष्य","title_en":"PM Surya Sarovar: 5,000 MW floating solar target","bullets_hi":["31 जुलाई को PM Surya Sarovar Yojana को ₹5,070 करोड़ के परिव्यय के साथ मंजूरी मिली।","लक्ष्य: 5,000 MW floating solar photovoltaic projects तथा co-located energy storage की न्यूनतम 10,000 MWh क्षमता (कम-से-कम 2 घंटे)।","परियोजनाएँ FY 2026-27 से FY 2030-31 के बीच sanction की जानी हैं।"],"bullets_en":["On 31 July, PM Surya Sarovar Yojana was approved with an outlay of ₹5,070 crore.","Target: 5,000 MW of floating solar photovoltaic projects and co-located energy storage of at least 10,000 MWh (minimum two-hour storage).","Projects are to be sanctioned from FY 2026-27 to FY 2030-31."],"exam_focus":"floating solar • energy storage • MNRE • 5,000 MW","source_title":"PIB — PM Surya Sarovar Yojana, 31 July 2026","source_url":"https://www.pib.gov.in/newsite/erelcontent.aspx?lang=2&reg=48&relid=292445","verification":"Official-source verified","note":""},{"id":"jul-pm-kisan-khelo","type":"news","month":"July 2026","date":"2026-07-31","region":"India","category":"Agriculture, Energy & Sports / कृषि, ऊर्जा एवं खेल","title_hi":"31 जुलाई: PM-KISAN, PM Surya Sarovar और Khelo India","title_en":"31 July: PM-KISAN, PM Surya Sarovar and Khelo India","bullets_hi":["31 जुलाई की कैबिनेट सूची में PM-KISAN की निरंतरता, Pradhan Mantri Surya Sarovar Yojana और revamped Khelo India Scheme के निर्णय शामिल थे।","उसी सूची में Samudra Manthan (National Offshore Exploration Scheme) भी दर्ज था।"],"bullets_en":["The 31 July Cabinet list included continuation of PM-KISAN, Pradhan Mantri Surya Sarovar Yojana and a revamped Khelo India Scheme.","The same list also recorded Samudra Manthan, the National Offshore Exploration Scheme."],"exam_focus":"PM-KISAN • ऊर्जा • खेल नीति • offshore exploration","source_title":"PIB — Cabinet Decisions archive, 31 July 2026","source_url":"https://www.pib.gov.in/EventDetail.aspx?ID=1234&lang=1&reg=3","verification":"Official-source verified","note":""},{"id":"jul-who-diagnostic","type":"news","month":"July 2026","date":"2026-07-02","region":"International","category":"Global Health & Science / वैश्विक स्वास्थ्य एवं विज्ञान","title_hi":"Ebola Bundibugyo के लिए WHO ने पहला diagnostic test सूचीबद्ध किया","title_en":"WHO lists first diagnostic test for Ebola Bundibugyo","bullets_hi":["2 जुलाई को WHO ने Ebola Bundibugyo virus के लिए पहला diagnostic test Emergency Use Listing में जोड़ा।","WHO ने 2 जुलाई को इस वायरस के संभावित उपचारों की पहचान के लिए scientific trial में patient enrolment शुरू होने की सूचना भी दी।"],"bullets_en":["On 2 July, WHO added the first diagnostic test for Ebola Bundibugyo virus to its Emergency Use Listing.","WHO also reported that patient enrolment had begun in a scientific trial to identify potential treatments."],"exam_focus":"WHO • Emergency Use Listing • Bundibugyo virus","source_title":"WHO — Ebola outbreak, DRC 2026","source_url":"https://www.who.int/emergencies/situations/ebola-outbreak---drc-2026","verification":"Official-source verified","note":""},{"id":"divider-aug","type":"month-divider","month":"August 2026","date":"","region":"All","category":"Month Index","title_hi":"अगस्त 2026 — मुख्य घटनाएँ","title_en":"AUGUST 2026 — KEY DEVELOPMENTS","bullets_hi":["राजस्थान प्रथम • राष्ट्रीय • अंतरराष्ट्रीय","स्रोत-आधारित चयनित घटनाएँ"],"bullets_en":["Rajasthan first • National • International","Selected source-linked developments"],"exam_focus":"महीने की सभी स्लाइडें आगे देखें","source_title":"","source_url":"","verification":"Index","note":""},{"id":"aug-trees-ucc","type":"news","month":"August 2026","date":"2026-08-13","region":"Rajasthan","category":"Cabinet, Environment & Law / मंत्रिमंडल, पर्यावरण एवं कानून","title_hi":"खेजड़ी सहित 29 वृक्ष प्रजातियों के संरक्षण का मसौदा","title_en":"Draft protection bill for 29 tree species, including khejri","bullets_hi":["राजस्थान मंत्रिमंडल ने Rajasthan Trees (Protection) Bill-2026 के मसौदे को मंजूरी दी।","खेजड़ी, रोहिड़ा, बरगद, पीपल, लसोड़ा, तेंदू, महुआ, कैर और चिरौंजी सहित 29 प्रजातियों का उल्लेख किया गया।","उसी बैठक में Rajasthan Uniform Civil Code Bill-2026 के मसौदे को भी मंजूरी दी गई; इसे विधेयक का मसौदा अनुमोदन समझें, लागू कानून नहीं।"],"bullets_en":["The Rajasthan Cabinet approved the draft Rajasthan Trees (Protection) Bill, 2026.","The release named 29 species, including khejri, rohida, banyan, peepal, lasora, tendu, mahua, ker and chironji.","The draft Rajasthan Uniform Civil Code Bill, 2026 was also approved at the meeting; this was draft approval, not enactment."],"exam_focus":"खेजड़ी • राज्य वृक्ष • विधेयक बनाम अधिनियम • UCC","source_title":"CMO Rajasthan — Cabinet decisions, 13 August 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/249305","verification":"Official-source verified","note":""},{"id":"aug-anupgarh","type":"news","month":"August 2026","date":"2026-08-14","region":"Rajasthan","category":"Urban Local Bodies & Infrastructure / नगरीय निकाय एवं आधारभूत संरचना","title_hi":"अनूपगढ़ में ₹389 करोड़ के 131 विकास कार्य","title_en":"131 development works worth ₹389 crore in Anupgarh","bullets_hi":["14 अगस्त को श्रीगंगानगर जिले के अनूपगढ़ दौरे में ₹389 करोड़ के 131 विकास कार्यों का लोकार्पण/शिलान्यास बताया गया।","मानसून में शहरी मरम्मत के लिए प्रत्येक नगरपालिका को ₹1 करोड़, नगर परिषद को ₹3 करोड़ और नगर निगम को ₹10 करोड़ देने की घोषणा की गई।","अनूपगढ़ किले के पुनरुद्धार और अतिरिक्त पुलिस अधीक्षक कार्यालय की स्थापना की घोषणा भी दर्ज थी।"],"bullets_en":["During the 14 August visit to Anupgarh in Sri Ganganagar district, 131 development works worth ₹389 crore were reported as inaugurated or foundation-laid.","For urban repairs during the monsoon, ₹1 crore per municipality, ₹3 crore per municipal council and ₹10 crore per municipal corporation were announced.","Restoration of Anupgarh Fort and an Additional Superintendent of Police office were also announced."],"exam_focus":"अनूपगढ़ • श्रीगंगानगर • नगरीय निकाय • स्थानीय प्रशासन","source_title":"CMO Rajasthan — Anupgarh visit, 14 August 2026","source_url":"https://cmo.rajasthan.gov.in/mega-event-detail/249502","verification":"Official-source verified","note":""},{"id":"aug-asha","type":"news","month":"August 2026","date":"2026-08-15","region":"Rajasthan","category":"Women & Child Development / महिला एवं बाल विकास","title_hi":"आशा सहयोगिनियों के मानदेय में 10% वृद्धि की घोषणा","title_en":"10% honorarium increase announced for ASHA Sahyoginis","bullets_hi":["15 अगस्त के राज्य स्तरीय कार्यक्रम में आशा सहयोगिनियों के मानदेय में 10% वृद्धि की घोषणा हुई।","विज्ञप्ति में आंगनबाड़ी कार्यकर्ताओं, सहायिकाओं और साथिनों को ₹1,100 प्रति खाते की DBT राशि तथा महिला/मातृत्व योजनाओं के अन्य भुगतान भी दर्ज थे।","इसी कार्यक्रम में 27 आकांक्षी ब्लॉकों में किशोरी बालिका योजना शुरू करने की जानकारी दी गई।"],"bullets_en":["At the state-level programme on 15 August, a 10% increase in ASHA Sahyoginis’ honorarium was announced.","The release also recorded a DBT transfer of ₹1,100 per account to Anganwadi workers, helpers and Sathins, along with other women and maternity scheme payments.","The Kishori Balika Yojana was also launched in 27 aspirational blocks."],"exam_focus":"आशा सहयोगिनी • किशोरी बालिका योजना • DBT • महिला कल्याण","source_title":"CMO Rajasthan — Saksham Nari, Swasth Bachpan programme","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/249569","verification":"Official-source verified","note":""},{"id":"aug-baran-jhalawar","type":"news","month":"August 2026","date":"2026-08-17","region":"Rajasthan","category":"Rural Development & Agriculture / ग्रामीण विकास एवं कृषि","title_hi":"बारां-जालावाड़: 98 परियोजनाएँ; PMAY-G के 2,89,355 घर","title_en":"Baran–Jhalawar: 98 projects; 289,355 PMAY-G houses approved","bullets_hi":["बारां और झालावाड़ के लिए 98 विकास परियोजनाओं की लागत ₹1,258 करोड़ बताई गई।","राज्य के लिए PMAY-Gramin के अंतर्गत 2,89,355 नए घरों हेतु ₹3,473 करोड़ की स्वीकृति-पत्र जानकारी दी गई।","कृषि विभाग के लिए राष्ट्रीय कृषि विकास योजना और कृषि उन्नति योजना के अंतर्गत ₹340.59 करोड़ की स्वीकृति का भी उल्लेख था।"],"bullets_en":["The release reported 98 development projects worth ₹1,258 crore for Baran and Jhalawar.","Approval letters were handed over for 289,355 new houses in Rajasthan under PMAY-Gramin at a cost of ₹3,473 crore.","It also referred to ₹340.59 crore approved under the National Agriculture Development Scheme and Krishi Unnati Yojana."],"exam_focus":"बारां • झालावाड़ • PMAY-G • ग्रामीण आवास • कृषि योजनाएँ","source_title":"CMO Rajasthan — Baran and Jhalawar development programme","source_url":"https://cmo.rajasthan.gov.in/mega-event-detail/249711","verification":"Official-source verified","note":""},{"id":"aug-alwar-works","type":"news","month":"August 2026","date":"2026-08-17","region":"Rajasthan","category":"Regional Development / क्षेत्रीय विकास","title_hi":"अलवर से 17 जिलों के लिए ₹6,453 करोड़ के 954 कार्य","title_en":"954 works worth ₹6,453 crore for 17 districts from Alwar","bullets_hi":["17 अगस्त की CMO सूची में अलवर से 17 जिलों के लिए 954 विकास कार्यों का उल्लेख है; लागत ₹6,453 करोड़ बताई गई।","उसी कार्यक्रम में बारां-जालावाड़ की 98 परियोजनाएँ और PMAY-G के 2,89,355 घरों की स्वीकृति भी दर्ज थी।"],"bullets_en":["The CMO’s 17 August event listing reported 954 development works worth ₹6,453 crore for 17 districts from Alwar.","The same programme listing also recorded 98 Baran–Jhalawar projects and approval for 289,355 PMAY-G houses."],"exam_focus":"अलवर • राजस्थान के जिले • क्षेत्रीय विकास","source_title":"CMO Rajasthan — Mega Events archive, 17 August 2026","source_url":"https://cmo.rajasthan.gov.in/mega-event-list","verification":"Official-source verified","note":"सरकारी event index पर सूचीबद्ध विवरण; जिलेवार project split इस slide में नहीं दिया गया।"},{"id":"aug-ebus","type":"news","month":"August 2026","date":"2026-08-18","region":"Rajasthan","category":"Transport & Clean Energy / परिवहन एवं स्वच्छ ऊर्जा","title_hi":"राजस्थान में 71 PM ई-बसों का शुभारंभ","title_en":"71 PM e-buses launched in Rajasthan","bullets_hi":["18 अगस्त को 71 PM ई-बसों का शुभारंभ हुआ।","24 बसें जयपुर और भीलवाड़ा के लिए तथा 47 बसें अलवर, अजमेर, जोधपुर, कोटा और उदयपुर के लिए बताई गईं।","इसी कार्यक्रम में लगभग ₹3,500 करोड़ के विकास कार्यों का लोकार्पण/शिलान्यास भी दर्ज था।"],"bullets_en":["A total of 71 PM e-buses were launched on 18 August.","Twenty-four were allocated to Jaipur and Bhilwara, and 47 to Alwar, Ajmer, Jodhpur, Kota and Udaipur.","The same programme also recorded inauguration/foundation-laying of development works worth nearly ₹3,500 crore."],"exam_focus":"ई-मोबिलिटी • PM e-Bus • राजस्थान के शहर","source_title":"CMO Rajasthan — 71 PM e-buses and development works","source_url":"https://cmo.rajasthan.gov.in/mega-event-detail/249816","verification":"Official-source verified","note":""},{"id":"aug-gobardhan","type":"news","month":"August 2026","date":"2026-08-06","region":"India","category":"Waste-to-Wealth & Energy / अपशिष्ट से ऊर्जा","title_hi":"GOBARdhan India: राष्ट्रीय एकीकृत योजना को मंजूरी","title_en":"GOBARdhan India: national unified scheme approved","bullets_hi":["6 अगस्त की केंद्रीय कैबिनेट सूची में GOBARdhan India’s National Unified Scheme for Comprehensive… को मंजूरी दर्ज है।","योजना का संबंध जैविक अपशिष्ट के प्रबंधन और उससे संसाधन/ऊर्जा प्राप्त करने से है; सटीक घटक और वित्तीय प्रावधान मूल PIB निर्णय में देखें।"],"bullets_en":["The 6 August Union Cabinet list records approval of GOBARdhan India’s National Unified Scheme for Comprehensive…","The initiative relates to management of organic waste and resource/energy recovery; consult the original Cabinet release for exact components and financial provisions."],"exam_focus":"GOBARdhan • जैविक अपशिष्ट • बायोगैस • circular economy","source_title":"PIB — Cabinet Decisions archive, 6 August 2026","source_url":"https://www.pib.gov.in/EventDetail.aspx?ID=1234&lang=1&reg=3","verification":"Official-source verified","note":"शीर्षक का पूरा विस्तार index snippet में truncation के कारण यहाँ नहीं गढ़ा गया है।"},{"id":"aug-who-risk","type":"news","month":"August 2026","date":"2026-08-20","region":"International","category":"Global Health / वैश्विक स्वास्थ्य","title_hi":"WHO ने Bundibugyo Ebola पर rapid risk assessment प्रकाशित किया","title_en":"WHO publishes rapid risk assessment on Bundibugyo Ebola","bullets_hi":["20 अगस्त को WHO ने DRC में Bundibugyo Ebola outbreak पर Rapid Risk Assessment v4 प्रकाशित किया।","उसी दिन WHO और Africa CDC ने Ervebo stockpile से 70,000 doses की प्रारंभिक allocation का स्वागत किया: 20,000 clinical trial के लिए और 50,000 frontline/health workers के लिए।","यह allocation investigational use/response context में था; इसे Bundibugyo के लिए licensed vaccine उपलब्ध होने के बराबर न समझें।"],"bullets_en":["On 20 August, WHO published Rapid Risk Assessment v4 on the Bundibugyo Ebola outbreak in the DRC.","On the same date, WHO and Africa CDC welcomed an initial allocation of 70,000 Ervebo doses from the stockpile: 20,000 for a clinical trial and 50,000 for frontline/health workers.","This was an allocation in an investigational/response context; it should not be read as a licensed vaccine being available for Bundibugyo."],"exam_focus":"WHO • Rapid Risk Assessment • DRC • Ebola","source_title":"WHO — Rapid Risk Assessment v4 and vaccine allocation, 20 August 2026","source_url":"https://www.who.int/news/item/20-08-2026-who-and-africa-cdc-welcome-the-allocation-of-ebola-vaccines-to-the-democratic-republic-of-the-congo","verification":"Official-source verified","note":""},{"id":"divider-sep","type":"month-divider","month":"September 2026","date":"","region":"All","category":"Month Index","title_hi":"सितंबर 2026 — मुख्य घटनाएँ","title_en":"SEPTEMBER 2026 — KEY DEVELOPMENTS","bullets_hi":["राजस्थान प्रथम • राष्ट्रीय • अंतरराष्ट्रीय","स्रोत-आधारित चयनित घटनाएँ"],"bullets_en":["Rajasthan first • National • International","Selected source-linked developments"],"exam_focus":"महीने की सभी स्लाइडें आगे देखें","source_title":"","source_url":"","verification":"Index","note":""},{"id":"sep-water-atalkendra","type":"news","month":"September 2026","date":"2026-09-23","region":"Rajasthan","category":"Water & Rural Development / जल एवं ग्रामीण विकास","title_hi":"ग्रामीण विकास रोडमैप और अटल ज्ञान केंद्र","title_en":"Rural development roadmap and Atal Gyan Kendras","bullets_hi":["मुख्यमंत्री ने ग्राम विकास रोडमैप में खेल मैदानों और अटल ज्ञान केंद्रों जैसी सुविधाओं का उल्लेख किया।","अटल ज्ञान केंद्रों के माध्यम से युवाओं को e-learning, e-library और e-Mitra जैसी सुविधाएँ देने का उद्देश्य बताया गया।","रामजल सेतु, यमुना जल, नर्मदा और किशाऊ परियोजनाओं को राजस्थान की जल उपलब्धता से जुड़े अंतरराज्यीय समझौतों के रूप में गिनाया गया।"],"bullets_en":["The Chief Minister described a rural development roadmap including sports grounds and Atal Gyan Kendras.","Atal Gyan Kendras were intended to provide youth with e-learning, e-library and e-Mitra-type facilities.","Ramjal Setu, Yamuna water, Narmada and Kishau projects were cited as inter-state agreements linked to Rajasthan’s water availability."],"exam_focus":"अटल ज्ञान केंद्र • ई-लाइब्रेरी • अंतरराज्यीय जल समझौते","source_title":"CMO Rajasthan — Seva Samvad programme, 23 September 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/251735","verification":"Official-source verified","note":""},{"id":"sep-adiparag","type":"news","month":"September 2026","date":"2026-09-26","region":"Rajasthan","category":"Tribal Economy & Forest Produce / जनजातीय अर्थव्यवस्था","title_hi":"‘वनगिरि’ का पहला शहद उत्पाद ‘आदिपराग’ लॉन्च","title_en":"‘Adiparag’, the first honey product of ‘Vangiri’, launched","bullets_hi":["26 सितंबर को प्रतापगढ़ कार्यक्रम में वन उत्पादों के विपणन/बिक्री के लिए राजससंघ और कॉनफैड के बीच MoU का आदान-प्रदान हुआ।","‘वनगिरि’ के प्रथम शहद उत्पाद ‘आदिपराग’ को लॉन्च किया गया।","उद्देश्य जनजातीय उत्पादकों को बेहतर बाजार, मूल्य और आजीविका अवसर देना बताया गया।"],"bullets_en":["At the Pratapgarh programme on 26 September, an MoU was exchanged between Rajsangh and CONFED for marketing and sale of forest produce.","‘Adiparag’, the first honey product under ‘Vangiri’, was launched.","The stated aim was to provide tribal producers better markets, prices and livelihood opportunities."],"exam_focus":"जनजातीय उत्पाद • राजससंघ • कॉनफैड • वनगिरि","source_title":"CMO Rajasthan — Pratapgarh visit, 26 September 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/251949","verification":"Official-source verified","note":""},{"id":"sep-khairthal","type":"news","month":"September 2026","date":"2026-09-28","region":"Rajasthan","category":"Industry & Infrastructure / उद्योग एवं आधारभूत संरचना","title_hi":"खैरथल-तिजारा क्षेत्र में ₹117 करोड़ की 95 परियोजनाएँ","title_en":"95 projects worth ₹117 crore in Khairthal-Tijara region","bullets_hi":["अलवर, खैरथल-तिजारा और कोटपूतली-बहरोड़ के विकास के लिए 95 परियोजनाओं का लोकार्पण/शिलान्यास हुआ।","CMO विज्ञप्ति के अनुसार परियोजनाओं का मूल्य ₹117 करोड़ था।","खैरथल-तिजारा को दिल्ली-NCR निकटता और भिवाड़ी औद्योगिक क्षेत्र के कारण उभरते औद्योगिक केंद्र के रूप में वर्णित किया गया।"],"bullets_en":["Ninety-five projects were inaugurated or had foundation stones laid for Alwar, Khairthal-Tijara and Kotputli-Behror.","The CMO release valued the projects at ₹117 crore.","Khairthal-Tijara was described as an emerging industrial hub due to its proximity to Delhi-NCR and the Bhiwadi industrial area."],"exam_focus":"खैरथल-तिजारा • भिवाड़ी • औद्योगिक विकास","source_title":"CMO Rajasthan — Khairthal-Tijara visit, 28 September 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/252167","verification":"Official-source verified","note":""},{"id":"sep-barmer","type":"news","month":"September 2026","date":"2026-09-30","region":"Rajasthan","category":"Water Security & Regional Development / जल सुरक्षा एवं क्षेत्रीय विकास","title_hi":"बाड़मेर क्षेत्र में ₹2,824 करोड़ के 1,013 कार्य","title_en":"1,013 works worth ₹2,824 crore in Barmer region","bullets_hi":["30 सितंबर को बाड़मेर दौरे के दौरान ₹2,824 करोड़ से अधिक के 1,013 विकास कार्यों का लोकार्पण/शिलान्यास बताया गया।","कम वर्षा वाले क्षेत्रों में आकस्मिक पेयजल व्यवस्था और टैंकर परिवहन 31 दिसंबर तक जारी रखने की घोषणा दर्ज थी।","बाड़मेर, बालोतरा और जैसलमेर क्षेत्र में चारा डिपो शुरू करने की घोषणा भी की गई।"],"bullets_en":["During the Barmer visit on 30 September, the CMO reported inauguration/foundation-laying of 1,013 development works worth over ₹2,824 crore.","The release recorded continuation of emergency drinking-water arrangements and tanker transport in low-rainfall areas through 31 December.","It also announced fodder depots for Barmer, Balotra and Jaisalmer areas."],"exam_focus":"बाड़मेर • पश्चिमी राजस्थान • सूखा राहत • पेयजल • चारा डिपो","source_title":"CMO Rajasthan — Barmer visit, 30 September 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/252302","verification":"Official-source verified","note":""},{"id":"sep-msp","type":"news","month":"September 2026","date":"2026-09-30","region":"India","category":"Agriculture & MSP / कृषि एवं न्यूनतम समर्थन मूल्य","title_hi":"रबी विपणन सत्र 2027-28 के लिए MSP निर्णय","title_en":"MSP decision for Rabi Marketing Season 2027-28","bullets_hi":["30 सितंबर को CCEA ने रबी विपणन सत्र 2027-28 के लिए सभी अधिदेशित रबी फसलों के MSP बढ़ाने को मंजूरी दी।","गेहूँ ₹2,610/क्विंटल; जौ ₹2,286; चना ₹5,958; मसूर ₹7,390; सरसों ₹6,613; कुसुम ₹7,215।","सबसे अधिक पूर्ण वृद्धि कुसुम में ₹675/क्विंटल और सरसों में ₹413/क्विंटल थी।"],"bullets_en":["On 30 September, the CCEA approved higher MSPs for all mandated Rabi crops for Marketing Season 2027-28.","Wheat ₹2,610/quintal; barley ₹2,286; gram ₹5,958; lentil ₹7,390; rapeseed & mustard ₹6,613; safflower ₹7,215.","The highest absolute increase was for safflower at ₹675/quintal, followed by rapeseed & mustard at ₹413."],"exam_focus":"MSP • रबी फसलें • विपणन सत्र 2027-28","source_title":"PIB — MSP for Rabi Crops, 30 September 2026","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2316956&lang=2&reg=48","verification":"Official-source verified","note":""},{"id":"sep-rail-multitracking","type":"news","month":"September 2026","date":"2026-09-09","region":"India","category":"Railways & Infrastructure / रेलवे एवं आधारभूत संरचना","title_hi":"रेलवे के 3 multitracking प्रोजेक्ट: 656 किमी","title_en":"Three railway multitracking projects: 656 km","bullets_hi":["9 सितंबर को CCEA ने तीन multitracking परियोजनाओं को मंजूरी दी।","कुल लागत ₹10,783 करोड़; परियोजनाएँ पश्चिम बंगाल, झारखंड, ओडिशा, मध्य प्रदेश और छत्तीसगढ़ के 14 जिलों को कवर करती हैं।","लगभग 656 किमी नेटवर्क वृद्धि और 4,790 गांवों (करीब 56 लाख आबादी) को बेहतर संपर्क का अनुमान दिया गया।"],"bullets_en":["On 9 September, the CCEA approved three railway multitracking projects.","Total cost: ₹10,783 crore; projects cover 14 districts across West Bengal, Jharkhand, Odisha, Madhya Pradesh and Chhattisgarh.","They are expected to add about 656 km and improve connectivity to around 4,790 villages with a population of about 56 lakh."],"exam_focus":"Railways • multitracking • PM Gati Shakti • 656 km","source_title":"PIB — Three railway multitracking projects, 9 September 2026","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2308258&lang=2&reg=48","verification":"Official-source verified","note":""},{"id":"sep-india-japan-cricket","type":"news","month":"September 2026","date":"2026-09-04","region":"International","category":"Sports & Cricket / खेल एवं क्रिकेट","title_hi":"भारत-जापान का पहला पुरुष T20I","title_en":"First men’s T20I between India and Japan","bullets_hi":["ICC ने 4 सितंबर को घोषणा की कि भारत और जापान 22 सितंबर 2026 को सानो, तोचिगी प्रीफेक्चर में अपना पहला पुरुष T20I खेलेंगे।","यह मुकाबला Asian Games 2026 से पहले तैयारी मैच के रूप में भी महत्वपूर्ण बताया गया।"],"bullets_en":["On 4 September, the ICC announced that India and Japan would play their first men’s T20I on 22 September 2026 in Sano, Tochigi Prefecture.","The match was also described as preparation ahead of the Asian Games 2026."],"exam_focus":"ICC • Japan • Sano International Cricket Ground • T20I","source_title":"International Cricket Council — India-Japan historic T20I","source_url":"https://www.icc-cricket.com/news/india-japan-set-to-play-historic-t20i-in-sano","verification":"Official-source verified","note":""},{"id":"divider-oct","type":"month-divider","month":"October 2026","date":"","region":"All","category":"Month Index","title_hi":"अक्टूबर 2026 — मुख्य घटनाएँ","title_en":"OCTOBER 2026 — KEY DEVELOPMENTS","bullets_hi":["राजस्थान प्रथम • राष्ट्रीय • अंतरराष्ट्रीय","स्रोत-आधारित चयनित घटनाएँ"],"bullets_en":["Rajasthan first • National • International","Selected source-linked developments"],"exam_focus":"महीने की सभी स्लाइडें आगे देखें","source_title":"","source_url":"","verification":"Index","note":""},{"id":"oct-hansiyawas","type":"news","month":"October 2026","date":"2026-10-01","region":"Rajasthan","category":"Water Infrastructure / जल आधारभूत संरचना","title_hi":"हंसियावास में ₹800 करोड़ के कृत्रिम जलाशय का शिलान्यास","title_en":"Foundation stone for ₹800-crore artificial reservoir at Hansiyawas","bullets_hi":["1 अक्टूबर की CMO विज्ञप्ति में शेखावाटी में यमुना जल लाने की दिशा में हंसियावास में ₹800 करोड़ के कृत्रिम जलाशय का शिलान्यास बताया गया।","यह घोषणा जल भंडारण और शेखावाटी क्षेत्र की पेयजल/जल उपलब्धता से संबंधित है।"],"bullets_en":["The CMO release dated 1 October reported the foundation stone for an artificial reservoir at Hansiyawas costing ₹800 crore as part of efforts to bring Yamuna water to Shekhawati.","The announcement relates to water storage and water availability in the Shekhawati region."],"exam_focus":"शेखावाटी • यमुना जल • कृत्रिम जलाशय","source_title":"CMO Rajasthan — Development works, 1 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/252379","verification":"Official-source verified","note":""},{"id":"oct-youth-portals","type":"news","month":"October 2026","date":"2026-10-02","region":"Rajasthan","category":"Youth & Employment / युवा एवं रोजगार","title_hi":"युवा पोर्टल और भर्ती/नियुक्ति स्थिति का सरकारी विवरण","title_en":"Youth portals and recruitment/employment update","bullets_hi":["2 अक्टूबर की CMO विज्ञप्ति में 1.93 लाख से अधिक नियुक्तियों, 1.18 लाख पदों पर प्रक्रियाधीन भर्ती और लगभग 1.25 लाख पदों के भर्ती कैलेंडर का उल्लेख था।","प्रतिभा पोर्टल, खेल मित्र पोर्टल और खेलो राजस्थान गेम्स पोर्टल सहित युवा-केंद्रित सेवाएँ शुरू करने की जानकारी दी गई।"],"bullets_en":["The 2 October CMO release cited over 193,000 appointments, recruitment underway for 118,000 posts and a calendar for around 125,000 posts.","It reported launches including Pratibha, Khel Mitra and Khelo Rajasthan Games portals."],"exam_focus":"राजस्थान भर्ती • रोजगार • युवा पोर्टल","source_title":"CMO Rajasthan — Sapno Ki Udaan youth programme, 2 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/252460","verification":"Official-source verified","note":"आँकड़े CMO विज्ञप्ति में सरकार द्वारा बताए गए हैं; ये independently audited totals नहीं हैं।"},{"id":"oct-sme-fund","type":"news","month":"October 2026","date":"2026-10-06","region":"India","category":"MSME & Finance / MSME एवं वित्त","title_hi":"SME Growth Fund के लिए ₹10,000 करोड़ की प्रतिबद्धता","title_en":"₹10,000 crore commitment for SME Growth Fund","bullets_hi":["6 अक्टूबर को केंद्रीय मंत्रिमंडल ने SME Growth Fund की स्थापना के लिए ₹10,000 करोड़ की सरकारी प्रतिबद्धता मंजूर की।","फंड का उद्देश्य growth-oriented MSMEs को direct equity investment के जरिए सहायता देना और “future champions” तैयार करना है।"],"bullets_en":["On 6 October, the Union Cabinet approved a government commitment of ₹10,000 crore towards establishing the SME Growth Fund.","The fund aims to support growth-oriented MSMEs through direct equity investments and help create future champions."],"exam_focus":"MSME • direct equity • SME Growth Fund • ₹10,000 crore","source_title":"PIB — SME Growth Fund, 6 October 2026","source_url":"https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=2319534&lang=2&reg=3","verification":"Official-source verified","note":""},{"id":"oct-nari-shakti","type":"news","month":"October 2026","date":"2026-10-03","region":"Rajasthan","category":"Women Empowerment / महिला सशक्तिकरण","title_hi":"नारी शक्ति सम्मेलन: राजस्थान की महिला कल्याण योजनाएँ","title_en":"Nari Shakti Sammelan: women welfare schemes in Rajasthan","bullets_hi":["3 अक्टूबर की CMO विज्ञप्ति में PM Matru Vandana Yojana सहायता ₹5,000 से ₹6,500 किए जाने का उल्लेख था।","विज्ञप्ति के अनुसार Maa Voucher Scheme में 5.74 लाख sonography coupons जारी हुए; Lakhpati Didi के अंतर्गत 26 लाख से अधिक महिलाओं को प्रशिक्षण और लगभग 20 लाख को Lakhpati Didi श्रेणी में बताया गया।","1.22 करोड़ महिलाओं/बालिकाओं को हर महीने 12 sanitary napkins निःशुल्क देने का दावा भी विज्ञप्ति में दर्ज था।"],"bullets_en":["The 3 October CMO release stated that assistance under PM Matru Vandana Yojana had been raised from ₹5,000 to ₹6,500.","It reported 574,000 sonography coupons under the Maa Voucher Scheme, over 2.6 million women trained under Lakhpati Didi and about 2 million brought into the Lakhpati Didi category.","The release also cited free monthly sanitary napkins for 12.2 million women and girls."],"exam_focus":"PMMVY • Maa Voucher • Lakhpati Didi • महिला कल्याण","source_title":"CMO Rajasthan — Nari Shakti Sammelan, 3 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/252486","verification":"Official-source verified","note":"सभी संख्याएँ CMO विज्ञप्ति में सरकार द्वारा बताए गए आँकड़े हैं।"},{"id":"oct-urban-100days","type":"news","month":"October 2026","date":"2026-10-05","region":"Rajasthan","category":"Urban Development / नगरीय विकास","title_hi":"नगरीय निकायों के लिए 100-दिवसीय रोडमैप","title_en":"100-day roadmap for urban local bodies","bullets_hi":["5 अक्टूबर को महापौरों, सभापतियों और अध्यक्षों के साथ 100-दिवसीय शहरी विकास रोडमैप पर संवाद हुआ।","दीपावली से पहले सड़क, सफाई और बुनियादी नागरिक सुविधाओं से जुड़े काम पूरे करने पर जोर दिया गया।"],"bullets_en":["On 5 October, a 100-day urban development roadmap was discussed with mayors, chairpersons and presidents of urban local bodies.","The focus was on completing roads, sanitation and basic civic-facility works before Diwali."],"exam_focus":"नगर निकाय • शहरी शासन • 100-day roadmap","source_title":"CMO Rajasthan — Urban local bodies dialogue, 5 October 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/252581","verification":"Official-source verified","note":""},{"id":"oct-kasarwadi","type":"news","month":"October 2026","date":"2026-10-14","region":"Rajasthan","category":"Solar Irrigation & Agriculture / सौर सिंचाई एवं कृषि","title_hi":"कसारवाड़ी सौर सूक्ष्म सिंचाई परियोजना","title_en":"Kasarwadi solar-based micro-irrigation project","bullets_hi":["बांसवाड़ा जिले की कसारवाड़ी परियोजना से 525 हेक्टेयर क्षेत्र में सिंचाई सुविधा का लक्ष्य बताया गया।","चार गांवों के लगभग 2,850 किसान लाभान्वित होंगे; 67.10 किमी पाइपलाइन और 700 kW सोलर प्लांट का विवरण दिया गया।","विज्ञप्ति के अनुसार परियोजना की commissioning शेष थी; इसे पूर्ण चालू परियोजना न समझें।"],"bullets_en":["The Kasarwadi project in Banswara district was described as targeting irrigation facilities for 525 hectares.","About 2,850 farmers in four villages were expected to benefit; the release described a 67.10-km pipeline and a 700 kW solar plant.","The release said commissioning remained pending; do not treat it as fully operational."],"exam_focus":"बांसवाड़ा • सौर सिंचाई • सूक्ष्म सिंचाई • जल प्रबंधन","source_title":"CMO Rajasthan — Kasarwadi solar irrigation project, 14 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/253179","verification":"Official-source verified","note":""},{"id":"oct-nri-rajasthan-foundation","type":"news","month":"October 2026","date":"2026-10-16","region":"Rajasthan","category":"Investment & Diaspora / निवेश एवं प्रवासी राजस्थानी","title_hi":"राजस्थान फाउंडेशन के 11 नए चैप्टर घोषित","title_en":"11 new Rajasthan Foundation chapters announced","bullets_hi":["16 अक्टूबर के Non-Resident Rajasthani Dialogue में राजस्थान फाउंडेशन के 11 नए चैप्टर घोषित किए गए।","CMO विज्ञप्ति में RAJNIVESH के माध्यम से 18 विभागों की 190 सेवाएँ उपलब्ध होने की जानकारी दी गई।","शेखावाटी की विरासत और पर्यटन के लिए heritage tourism circuit विकसित करने का भी उल्लेख था।"],"bullets_en":["At the Non-Resident Rajasthani Dialogue on 16 October, 11 new Rajasthan Foundation chapters were announced.","The CMO release stated that 190 services from 18 departments were available through RAJNIVESH.","It also referred to a heritage tourism circuit for Shekhawati."],"exam_focus":"राजस्थान फाउंडेशन • RAJNIVESH • प्रवासी राजस्थानी • शेखावाटी","source_title":"CMO Rajasthan — Non-Resident Rajasthani Dialogue, 16 October 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/253403","verification":"Official-source verified","note":""},{"id":"oct-journalist-housing","type":"news","month":"October 2026","date":"2026-10-17","region":"Rajasthan","category":"Housing & Welfare / आवास एवं कल्याण","title_hi":"पत्रकारों के लिए विशिष्ट पंजीकरण आवास योजना-2026","title_en":"Vishisht Panjikaran housing scheme-2026 for journalists","bullets_hi":["17 अक्टूबर को जयपुर के जगतपुरा में अधिस्वीकृत पत्रकारों के लिए फ्लैट पंजीकरण शुरू करने की जानकारी दी गई।","घोषित विशेष छूट: 3-BHK फ्लैट पर ₹15 लाख और 2-BHK पर ₹12 लाख।","भरतपुर में पूंछरी का लौठा के पास विकसित हो रही satellite city में भी योजना लाने की घोषणा की गई।"],"bullets_en":["On 17 October, registration was opened for flats for accredited journalists in Jagatpura, Jaipur.","Announced special discounts: ₹15 lakh on a 3-BHK flat and ₹12 lakh on a 2-BHK flat.","A housing scheme was also announced for the satellite city near Poonchhari Ka Lautha in Bharatpur."],"exam_focus":"राजस्थान आवासन मंडल • पत्रकार कल्याण • आवास योजना","source_title":"CMO Rajasthan — Vishisht Panjikaran Yojana-2026, 17 October 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/253426","verification":"Official-source verified","note":""},{"id":"oct-kalika","type":"news","month":"October 2026","date":"2026-10-18","region":"Rajasthan","category":"Women Safety & Policing / महिला सुरक्षा एवं पुलिस","title_hi":"100 नई कालिका पेट्रोलिंग यूनिट शुरू","title_en":"100 new Kalika Patrolling Units launched","bullets_hi":["18 अक्टूबर को नवरात्र अवसर पर 100 नई कालिका पेट्रोलिंग यूनिट शुरू की गईं।","महिला पुलिसकर्मियों के लिए मासिक यात्रा भत्ते की घोषणा की गई।","यूनिटों को महिला सुरक्षा और सार्वजनिक जागरूकता से जोड़कर प्रस्तुत किया गया।"],"bullets_en":["One hundred new Kalika Patrolling Units were launched on 18 October during Navratra.","A monthly travel allowance was announced for women police personnel.","The units were presented as part of women’s safety and public-awareness efforts."],"exam_focus":"राजस्थान पुलिस • महिला सुरक्षा • कालिका पेट्रोलिंग","source_title":"CMO Rajasthan — Kalika Patrolling Units, 18 October 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/253438","verification":"Official-source verified","note":""},{"id":"oct-asha-revision","type":"news","month":"October 2026","date":"2026-10-26","region":"Rajasthan","category":"Health Workforce / स्वास्थ्य कार्यबल","title_hi":"आशा सहयोगिनी का मानदेय ₹5,455 मासिक","title_en":"ASHA Sahyogini monthly honorarium set at ₹5,455","bullets_hi":["26 अक्टूबर की CMO विज्ञप्ति के अनुसार आशा सहयोगिनियों का मासिक मानदेय ₹4,959 से बढ़ाकर ₹5,455 किया गया।","10% वृद्धि 1 अक्टूबर 2026 से देय बताई गई; यह वित्तीय स्वीकृति की सूचना है।"],"bullets_en":["The 26 October CMO release stated that the monthly honorarium of ASHA Sahyoginis was raised from ₹4,959 to ₹5,455.","The 10% increase was stated to be payable from 1 October 2026; the release records financial approval."],"exam_focus":"ASHA • राजस्थान स्वास्थ्य विभाग • मानदेय","source_title":"CMO Rajasthan — ASHA honorarium revision, 26 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/253870","verification":"Official-source verified","note":""},{"id":"oct-road-network","type":"news","month":"October 2026","date":"2026-10-27","region":"Rajasthan","category":"Roads & Infrastructure / सड़क एवं आधारभूत संरचना","title_hi":"राजस्थान में 51,790 किमी सड़क विकास का सरकारी विवरण","title_en":"Government update: 51,790 km of road development in Rajasthan","bullets_hi":["27 अक्टूबर की CMO विज्ञप्ति के अनुसार ₹37,527 करोड़ से 51,790 किमी सड़कों का विकास बताया गया।","₹9,704 करोड़ से 18,917 किमी नई सड़कें बिछाने और 1,760 गांवों को डामर सड़कों से जोड़ने का विवरण दिया गया।","Atal Pragati Path योजना में 765 पथों के लिए ₹1,686 करोड़ की स्वीकृति और 335 पूर्ण होने का उल्लेख था।"],"bullets_en":["The 27 October CMO release reported road development covering 51,790 km at a cost of ₹37,527 crore.","It cited 18,917 km of new roads built at ₹9,704 crore and 1,760 villages connected by asphalt roads.","Under Atal Pragati Path, ₹1,686 crore had been sanctioned for 765 paths, of which 335 were reported complete."],"exam_focus":"PWD • सड़क विकास • Atal Pragati Path • ग्रामीण कनेक्टिविटी","source_title":"CMO Rajasthan — Road connectivity update, 27 October 2026","source_url":"https://cmo.rajasthan.gov.in/programdetail/253927","verification":"Official-source verified","note":"ये CMO द्वारा रिपोर्ट किए गए संचयी सरकारी आँकड़े हैं।"},{"id":"oct-narmada","type":"news","month":"October 2026","date":"2026-10-27","region":"Rajasthan","category":"Inter-State Water Management / अंतरराज्यीय जल प्रबंधन","title_hi":"नर्मदा नियंत्रण प्राधिकरण की 15वीं समीक्षा समिति बैठक","title_en":"15th Review Committee meeting of Narmada Control Authority","bullets_hi":["27 अक्टूबर को केंद्रीय जल शक्ति मंत्री की अध्यक्षता में Narmada Control Authority की 15वीं Review Committee बैठक हुई।","राजस्थान सहित गुजरात, मध्य प्रदेश और महाराष्ट्र के मुख्यमंत्रियों ने वीडियो कॉन्फ्रेंस से भाग लिया।","राजस्थान ने मानसून के अतिरिक्त जल के भंडारण हेतु DPR तैयार करने और नर्मदा नहर कमांड क्षेत्र में sprinkler irrigation पर जोर दिया।"],"bullets_en":["The 15th Review Committee meeting of the Narmada Control Authority was held on 27 October under the Union Jal Shakti Minister.","The Chief Ministers of Rajasthan, Gujarat, Madhya Pradesh and Maharashtra joined by video conference.","Rajasthan discussed a DPR to store surplus monsoon water and sprinkler irrigation in the Narmada Canal command area."],"exam_focus":"नर्मदा • जल विवाद/प्राधिकरण • cooperative federalism • sprinkler irrigation","source_title":"CMO Rajasthan — Narmada Control Authority meeting, 27 October 2026","source_url":"https://cmo.rajasthan.gov.in/pressreleasedetail/253967","verification":"Official-source verified","note":""},{"id":"oct-nsapp","type":"news","month":"October 2026","date":"2026-10-14","region":"India","category":"Social Security & Pensions / सामाजिक सुरक्षा एवं पेंशन","title_hi":"NSAP को 2030-31 तक जारी रखने की मंजूरी","title_en":"NSAP continuation approved through 2030-31","bullets_hi":["केंद्रीय मंत्रिमंडल ने 2026-27 से 2030-31 तक पाँच वर्षों के लिए ₹53,428 करोड़ के कुल परिव्यय के साथ NSAP जारी रखने की मंजूरी दी।","नया नाम: प्रधानमंत्री सामाजिक सहायता योजना (PM Samajik Sahayata Yojana)।","दिव्यांगजन पेंशन में benchmark disability सीमा 80% से घटाकर 40% की गई; न्यूनतम 18 वर्ष आयु सीमा हटाई गई। केंद्रीय सहायता 0–79 वर्ष के लिए ₹375/माह और 80+ के लिए ₹625/माह बताई गई।"],"bullets_en":["The Union Cabinet approved NSAP continuation for five years, 2026-27 to 2030-31, with an outlay of ₹53,428 crore.","New name: Pradhan Mantri Samajik Sahayata Yojana.","For disability pension, the benchmark disability threshold was reduced from 80% to 40%, and the minimum age of 18 was removed. Central assistance was stated as ₹375/month for ages 0–79 and ₹625/month for 80+."],"exam_focus":"NSAP • सामाजिक सुरक्षा • पेंशन • ₹53,428 करोड़","source_title":"PIB — PM Samajik Sahayata Yojana backgrounder, 22 October 2026","source_url":"https://www.pib.gov.in/PressReleasepage.aspx?PRID=2326529&lang=2&reg=3","verification":"Official-source verified","note":""},{"id":"oct-railway-bonus","type":"news","month":"October 2026","date":"2026-10-14","region":"India","category":"Railways & Employees / रेलवे एवं कर्मचारी","title_hi":"रेलवे कर्मचारियों के लिए 78 दिनों का Productivity Linked Bonus","title_en":"78-day Productivity Linked Bonus for railway employees","bullets_hi":["14 अक्टूबर को केंद्रीय मंत्रिमंडल ने 78 दिनों के PLB के लिए ₹2,009.61 करोड़ मंजूर किए।","लगभग 11,40,770 गैर-राजपत्रित रेलवे कर्मचारियों को लाभ; अधिकतम भुगतान ₹17,951 प्रति पात्र कर्मचारी बताया गया।","लाभार्थियों में track maintainer, loco pilot, train manager, station master, technician और अन्य Group C कर्मचारी शामिल हैं।"],"bullets_en":["On 14 October, the Union Cabinet approved ₹2,009.61 crore for a 78-day PLB.","About 11,40,770 non-gazetted railway employees were to benefit; maximum payment was stated as ₹17,951 per eligible employee.","Beneficiaries include track maintainers, loco pilots, train managers, station masters, technicians and other Group C staff."],"exam_focus":"रेलवे • Productivity Linked Bonus • केंद्रीय कैबिनेट","source_title":"PIB — Railway PLB, 14 October 2026","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2323256&lang=1&reg=3","verification":"Official-source verified","note":""},{"id":"oct-da-dr","type":"news","month":"October 2026","date":"2026-10-28","region":"India","category":"Pay & Pension / वेतन एवं पेंशन","title_hi":"केंद्र सरकार कर्मचारियों के DA/पेंशनरों के DR में 3% वृद्धि","title_en":"3% increase in DA for Central Government employees and DR for pensioners","bullets_hi":["28 अक्टूबर को केंद्रीय मंत्रिमंडल ने DA/DR में 3 प्रतिशत अतिरिक्त किस्त मंजूर की, प्रभावी 1 जुलाई 2026 से।","यह मौजूदा 60% दर के ऊपर है; नई दर 63% बनती है।","लगभग 48.54 लाख कर्मचारी और 68.71 लाख पेंशनर लाभार्थी; वार्षिक राजकोषीय प्रभाव ₹10,016.10 करोड़ बताया गया।"],"bullets_en":["On 28 October, the Union Cabinet approved an additional 3 percentage-point instalment of DA/DR, effective 1 July 2026.","It is over the existing 60% rate, taking the rate to 63%.","About 48.54 lakh employees and 68.71 lakh pensioners are beneficiaries; annual fiscal impact was stated as ₹10,016.10 crore."],"exam_focus":"DA • DR • 7th CPC • 63%","source_title":"PIB — DA/DR decision, 28 October 2026","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2329484&lang=1&reg=1","verification":"Official-source verified","note":""},{"id":"oct-vgs-y","type":"news","month":"October 2026","date":"2026-10-28","region":"India","category":"Panchayati Raj & Governance / पंचायती राज एवं शासन","title_hi":"प्रधानमंत्री विकसित ग्राम स्वराज योजना को मंजूरी","title_en":"Pradhan Mantri Viksit Gram Swaraj Yojana approved","bullets_hi":["केंद्रीय मंत्रिमंडल ने 2026-27 से 2030-31 तक Centrally Sponsored Scheme को मंजूरी दी।","कुल परिव्यय ₹7,395.55 करोड़; इसमें केंद्रीय अंश ₹4,869.48 करोड़ और राज्य अंश ₹2,526.07 करोड़ बताया गया।","लगभग 2.55 लाख पंचायतों/परंपरागत स्थानीय निकायों में करीब 32 लाख निर्वाचित प्रतिनिधि और पंचायत कार्यकर्ता प्रत्यक्ष लाभार्थी बताए गए।"],"bullets_en":["The Union Cabinet approved the Centrally Sponsored Scheme for 2026-27 to 2030-31.","Total outlay: ₹7,395.55 crore, comprising a Central share of ₹4,869.48 crore and State share of ₹2,526.07 crore.","Around 32 lakh elected representatives and Panchayat functionaries across over 2.55 lakh Panchayats and Traditional Local Bodies were identified as direct beneficiaries."],"exam_focus":"पंचायती राज • CSS • ग्राम शासन • 16वाँ वित्त आयोग काल","source_title":"PIB — PM Viksit Gram Swaraj Yojana, 28 October 2026","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2329491&lang=1&reg=1","verification":"Official-source verified","note":""},{"id":"oct-khelo-goods","type":"news","month":"October 2026","date":"2026-10-28","region":"India","category":"Sports Manufacturing / खेल सामग्री विनिर्माण","title_hi":"Khelo India Sports Goods Manufacturing Scheme","title_en":"Khelo India Sports Goods Manufacturing Scheme","bullets_hi":["केंद्रीय मंत्रिमंडल ने 28 अक्टूबर को ₹1,856.67 करोड़ के परिव्यय वाली योजना को मंजूरी दी।","अवधि FY 2026-27 से FY 2033-34 है।","योजना में Sports Goods Manufacturing Zones, testing/design facilities, investment support, certification, skill development और export promotion शामिल हैं।"],"bullets_en":["The Union Cabinet approved the scheme on 28 October with an outlay of ₹1,856.67 crore.","The period is FY 2026-27 to FY 2033-34.","It includes Sports Goods Manufacturing Zones, testing/design facilities, investment support, certification, skill development and export promotion."],"exam_focus":"Khelo India • खेल अर्थव्यवस्था • विनिर्माण • निर्यात","source_title":"PIB — Khelo India Sports Goods Manufacturing Scheme","source_url":"https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2329481&lang=1&reg=1","verification":"Official-source verified","note":""},{"id":"oct-container-scheme","type":"news","month":"October 2026","date":"2026-10-28","region":"India","category":"Maritime & Manufacturing / समुद्री व्यापार एवं विनिर्माण","title_hi":"Container Manufacturing Promotion Scheme: ₹10,000 करोड़","title_en":"Container Manufacturing Promotion Scheme: ₹10,000 crore","bullets_hi":["केंद्रीय मंत्रिमंडल ने Container Manufacturing Promotion Scheme को मंजूरी दी।","PIB backgrounder के अनुसार योजना का बजटीय परिव्यय FY 2039-40 तक ₹10,000 करोड़ है।","उद्देश्य देश में shipping container निर्माण क्षमता और घरेलू आपूर्ति श्रृंखला को मजबूत करना है।"],"bullets_en":["The Union Cabinet approved the Container Manufacturing Promotion Scheme.","The PIB backgrounder gives a budgetary outlay of ₹10,000 crore up to FY 2039-40.","The stated objective is to strengthen domestic shipping-container manufacturing capacity and supply chains."],"exam_focus":"समुद्री परिवहन • कंटेनर • Make in India • ₹10,000 करोड़","source_title":"PIB — Container Manufacturing Promotion Scheme","source_url":"https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=160605&id=160605&lang=1&reg=44","verification":"Official-source verified","note":""},{"id":"oct-pmkisan","type":"news","month":"October 2026","date":"2026-10-30","region":"India","category":"Agriculture & DBT / कृषि एवं प्रत्यक्ष लाभ अंतरण","title_hi":"PM-KISAN क ts & Olympics / खेल एवं ओलंपिक","title_hi":"Dakar 2026 Youth Olympic Games शुरू","title_en":"Dakar 2026 Youth Olympic Games begin","bullets_hi":["31 अक्टूबर से 13 नवंबर 2026 तक Senegal में चौथे Summer Youth Olympic Games आयोजित होने हैं।","यह पहली बार है जब अफ्रीकी महाद्वीप पर Olympic sporting event आयोजित हो रहा है।","मेजबान स्थल: Dakar, Diamniadio और Saly।"],"bullets_en":["The fourth Summer Youth Olympic Games are scheduled in Senegal from 31 October to 13 November 2026.","It is the first Olympic sporting event to be held on the African continent.","Host sites: Dakar, Diamniadio and Saly."],"exam_focus":"Youth Olympic Games • Senegal • Dakar • पहली बार अफ्रीका","source_title":"International Olympic Committee — Dakar 2026 media information","source_url":"https://www.olympics.com/ioc/news/4th-summer-youth-olympic-games-dakar-2026-information-for-the-media","verification":"Official-source verified","note":""},{"id":"daily-update-oct31","type":"news","month":"October 2026","date":"2026-10-30","region":"India","category":"Daily Update / ताज़ा अपडेट","title_hi":"पिछले 24 घंटे: PM-KISAN और India–BLEU","title_en":"Last 24 hours: PM-KISAN and India–BLEU","bullets_hi":["30 अक्टूबर: PM-KISAN की 24वीं किस्त — 9.34 करोड़ किसानों को ₹18,690 करोड़ से अधिक DBT।","30 अक्टूबर: Luxembourg में 19वाँ India–BLEU Joint Economic Commission सत्र।","31 अक्टूबर: राष्ट्रपति का महाराष्ट्र और हरियाणा दौरा निर्धारित; यह PIB की 30 अक्टूबर की पूर्व-घोषणा है।"],"bullets_en":["30 October: 24th PM-KISAN instalment — over ₹18,690 crore DBT to 9.34 crore farmers.","30 October: 19th India–BLEU Joint Economic Commission session in Luxembourg.","31 October: President’s visit to Maharashtra and Haryana was scheduled; this is a prior announcement dated 30 October."],"exam_focus":"ताज़ा घटनाएँ • PIB daily releases • event date vs announcement date","source_title":"PIB — 30 October 2026 releases","source_url":"https://www.pib.gov.in/AllReleasem.aspx?lang=1&reg=1","verification":"Official-source verified","note":"PM-KISAN और India–BLEU की विस्तृत स्लाइडें भी देखें।"}];
const $=id=>document.getElementById(id);let visible=DATA.slice(),idx=0;
const months=[...new Set(DATA.map(s=>s.month).filter(Boolean))];months.forEach(m=>{if(m==='Review')return;let o=document.createElement('option');o.value=m;o.textContent=m;$('month').appendChild(o)});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function list(items){return '<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function render(){if(window.speechSynthesis)window.speechSynthesis.cancel();if(!visible.length)return;const s=visible[idx];const stage=$('stage');stage.className='slide '+(s.type==='cover'?'cover':s.type==='month-divider'?'divider':s.type==='quiz'?'quiz':s.type==='quiz-answers'?'quiz answer':s.type==='sources'?'sources':'');let date=s.date?new Date(s.date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';let head='<div class="s-head"><div><div class="kicker">'+esc(s.month||'Current Affairs')+' • '+esc(s.region||'')+'</div></div><div class="date">'+esc(date)+'</div></div>';let title='<h1 class="s-title">'+esc(s.title_hi||'')+'</h1><p class="s-en">'+esc(s.title_en||'')+'</p>';let body='<div class="s-body"><section class="lang"><h3>हिंदी</h3>'+list(s.bullets_hi||[])+'</section>'+(s.type==='cover'?'':'<section class="lang"><h3>ENGLISH</h3>'+list(s.bullets_en||[])+'</section>')+'</div>';if(s.type==='cover')body='<div class="s-body"><section class="lang"><h3>ARCHIVE OVERVIEW</h3>'+list(s.bullets_hi||[])+'</section></div>';let meta='';if(s.category)meta+='<span class="pill">'+esc(s.category)+'</span>';if(s.verification)meta+='<span class="pill status">'+esc(s.verification)+'</span>';if(s.exam_focus)meta+='<div class="exam"><b>Exam focus / परीक्षा उपयोग:</b> '+esc(s.exam_focus)+'</div>';if(s.source_url)meta+='<a class="source" href="'+esc(s.source_url)+'" target="_blank" rel="noopener">Source / स्रोत: '+esc(s.source_title||'Open official source')+' ↗</a>';if(s.note)meta+='<div class="note">Note / टिप्पणी: '+esc(s.note)+'</div>';stage.innerHTML=head+title+body+'<div class="meta">'+meta+'</div>';$('count').textContent=(idx+1)+' / '+visible.length;$('prev').disabled=idx===0;$('next').disabled=idx===visible.length-1;$('bar').style.width=((idx+1)/visible.length*100)+'%';}
function filter(){const m=$('month').value;visible=m==='all'?DATA.slice():DATA.filter(s=>s.month===m);idx=0;render()}
$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<visible.length-1){idx++;render()}};$('month').onchange=filter;$('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});let x0=0;document.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>55){if(dx<0)$('next').click();else $('prev').click()}},{passive:true});function loadAudioVoices(){const el=$('audioVoice');if(!el||!window.speechSynthesis)return;const old=el.value;const all=window.speechSynthesis.getVoices()||[];const list=all.filter(v=>/^(hi|en)/i.test(v.lang));el.innerHTML='<option value="">Auto voice</option>';list.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';el.appendChild(o)});if(old&&[...el.options].some(o=>o.value===old))el.value=old;}
function slideVoice(lang){const all=window.speechSynthesis?.getVoices?.()||[];const selected=all.find(v=>v.voiceURI===$('audioVoice').value);if(selected&&selected.lang.toLowerCase().startsWith(lang.slice(0,2)))return selected;return all.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)))||null;}
function listenSlide(){if(!('speechSynthesis' in window)){$('audioStatus').textContent='Speech is not supported in this browser.';return;}const s=visible[idx];if(!s)return;const mode=$('audioLanguage').value;const hi=[s.title_hi,...(s.bullets_hi||[]),s.exam_focus,s.note].filter(Boolean).join('. ');const en=[s.title_en,...(s.bullets_en||[])].filter(Boolean).join('. ');const chunks=mode==='hi'?[{text:hi,lang:'hi-IN'}]:mode==='en'?[{text:en,lang:'en-IN'}]:[{text:hi,lang:'hi-IN'},{text:en,lang:'en-IN'}];const usable=chunks.filter(x=>x.text.trim());if(!usable.length){$('audioStatus').textContent='No text available on this slide.';return;}window.speechSynthesis.cancel();let remaining=usable.length;$('audioStatus').textContent='Playing…';usable.forEach(x=>{const u=new SpeechSynthesisUtterance(x.text);u.lang=x.lang;u.rate=Number($('audioRate').value)||1;const v=slideVoice(x.lang);if(v)u.voice=v;u.onend=()=>{remaining--;if(!remaining)$('audioStatus').textContent='Finished / सुनना पूरा हुआ';};u.onerror=e=>{$('audioStatus').textContent='Speech error: '+(e.error||'unknown');remaining--;};window.speechSynthesis.speak(u);});}
$('audioRate').addEventListener('input',e=>$('audioRateValue').textContent=Number(e.target.value).toFixed(1)+'×');
$('listenSlide').addEventListener('click',listenSlide);
$('stopSlide').addEventListener('click',()=>{window.speechSynthesis?.cancel();$('audioStatus').textContent='Stopped / बंद';});
if(window.speechSynthesis){loadAudioVoices();window.speechSynthesis.addEventListener?.('voiceschanged',loadAudioVoices);setTimeout(loadAudioVoices,600);}
render();
