const labels=["V1 \u2013 80 Questions", "V2 \u2013 160 Questions", "V3 \u2013 320 Questions", "V4 \u2013 400 Questions", "V5 \u2013 800 Questions (Basic to Advanced)"];
const descriptions={
"V1 – 80 Questions":"Starter bank • 5 questions per chapter",
"V2 – 160 Questions":"Expanded bank • 10 questions per chapter",
"V3 – 320 Questions":"Practice bank • 20 questions per chapter",
"V4 – 400 Questions":"Extended bank • 25 questions per chapter",
"V5 – 800 Questions (Basic to Advanced)":"Master bank • 50 questions per chapter • Basic, Intermediate and Advanced levels"
};
function loadVersion(name){
 document.querySelectorAll("button[data-version]").forEach(b=>b.classList.toggle("active",b.dataset.version===name));
 document.getElementById("desc").textContent=descriptions[name]||"Interactive question bank";
 const raw=atob(versions[name]);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=new TextDecoder("utf-8").decode(bytes);
 document.getElementById("bank").srcdoc=html;
}
const buttons=document.getElementById("buttons");
labels.forEach(name=>{const b=document.createElement("button");b.textContent=name;b.dataset.version=name;b.onclick=()=>loadVersion(name);buttons.appendChild(b);});
loadVersion(labels[labels.length-1]);
</script>
