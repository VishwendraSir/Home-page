<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff7eb6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>🍭 Manushree Candy Garden V4.9 Complete — Magical Learning & Adventure World</title>
  <style>
    :root {
      --pink: #ff7eb6;
      --pink-deep: #e85598;
      --purple: #9d6bff;
      --purple-deep: #7442e0;
      --sky: #5cc8ff;
      --sky-deep: #299ee0;
      --yellow: #ffd166;
      --yellow-deep: #e6a922;
      --mint: #5ce1b6;
      --mint-deep: #24b386;
      --white: #ffffff;
      --cream: #fff9fc;
      --ink: #2b2440;
      --muted: #685e82;
      --shadow: 0 10px 28px rgba(116, 66, 224, 0.14);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Trebuchet MS", "Nunito", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 126, 182, 0.24), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(92, 200, 255, 0.25), transparent 38%),
        radial-gradient(circle at 82% 85%, rgba(92, 225, 182, 0.24), transparent 42%),
        linear-gradient(180deg, #fff5fa 0%, #f4f0ff 52%, #eefbf7 100%);
      overflow-x: hidden;
    }

    button, select, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 3px solid #ffe0ef;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(157, 107, 255, 0.08);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: grid;
      place-items: center;
      font-size: 24px;
      color: var(--white);
      box-shadow: 0 6px 14px rgba(157, 107, 255, 0.28);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink);
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
    }

    .hud-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.88rem;
      background: var(--white);
      border: 2px solid #ece4ff;
      box-shadow: 0 3px 10px rgba(43, 36, 64, 0.06);
    }

    .pill-coins { border-color: #ffd166; background: #fffbef; }
    .pill-stars { border-color: #ff9ec7; background: #fff4f9; }
    .pill-gems  { border-color: #6fd3ff; background: #f0faff; }
    .pill-streak { border-color: #5ce1b6; background: #eefff9; }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .chip-btn {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      background: #f5f0ff;
      color: var(--purple-deep);
      border: 2px solid #dfd2ff;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .chip-btn:hover { transform: translateY(-1px); }
    .chip-btn.active {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: var(--white);
      border-color: transparent;
    }

    .chip-btn.muted {
      background: #f3f3f6;
      color: #7c7691;
      border-color: #dedae8;
    }

    .nav-strip {
      max-width: 1180px;
      margin: 12px auto 0;
      padding: 0 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .nav-strip::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 0.94rem;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      border: 2px solid #eadfff;
      box-shadow: 0 4px 12px rgba(157, 107, 255, 0.07);
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(232, 85, 152, 0.25);
    }

    .container {
      max-width: 1180px;
      margin: 14px auto 48px;
      padding: 0 14px;
    }

    .view {
      display: none;
      animation: fadeSlide 0.28s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 3px solid #ffe0ef;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }

    @media (max-width: 820px) {
      .hero-card {
        grid-template-columns: 1fr;
      }
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff0f7;
      color: var(--pink-deep);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .hero-title {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 3.2vw, 2.15rem);
      line-height: 1.15;
      color: var(--ink);
    }

    .hero-desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .streak-banner {
      background: linear-gradient(120deg, #fff9e6 0%, #fff0f7 52%, #ebfff7 100%);
      border: 2.5px solid #ffd166;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 6px 16px rgba(230, 169, 34, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: var(--white);
      font-weight: 800;
      font-size: 0.98rem;
      padding: 13px 20px;
      border-radius: 16px;
      min-height: 48px;
      box-shadow: 0 8px 18px rgba(157, 107, 255, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary {
      background: #f0faff;
      color: var(--sky-deep);
      border: 2px solid #9be0ff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 18px;
      border-radius: 16px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-mint {
      background: linear-gradient(135deg, var(--mint), var(--sky));
      color: var(--ink);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 18px;
      border-radius: 16px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-warn {
      background: #fff4f4;
      color: #c83755;
      border: 2px solid #ffbac7;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 16px;
      border-radius: 14px;
      min-height: 44px;
    }

    .garden-canvas-box {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid #d9f3ff;
      background: linear-gradient(180deg, #b8ebff 0%, #e7f8ff 58%, #c9f7e5 100%);
      min-height: 250px;
      box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.7);
    }

    .garden-canvas-box svg {
      width: 100%;
      height: 265px;
      display: block;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.75); }
    }

    .float-anim { animation: floatSlow 3.4s ease-in-out infinite; }
    .flap-anim { animation: wingFlap 0.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    .hotspot-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .hotspot-chip {
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      border: 2px solid var(--purple);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(43, 36, 64, 0.12);
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.3rem;
      color: var(--ink);
    }

    .section-head p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .worlds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 14px;
    }

    .world-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      border: 3px solid #efe7ff;
      box-shadow: 0 8px 20px rgba(157, 107, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .world-card:hover {
      transform: translateY(-3px);
      border-color: var(--pink);
    }

    .world-emoji {
      font-size: 2rem;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #fff3f9;
    }

    .world-name {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 2px 0;
    }

    .world-sub {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .world-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .badge-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ebfff7;
      color: var(--mint-deep);
    }

    .play-mini-btn {
      padding: 9px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: var(--white);
      font-weight: 800;
      font-size: 0.85rem;
      min-height: 40px;
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 3px solid #ece4ff;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stage-banner {
      background: linear-gradient(120deg, #fff0f7 0%, #f2ecff 50%, #e8fff7 100%);
      border: 3px solid var(--pink);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .choice-btn {
      padding: 14px 12px;
      border-radius: 16px;
      background: #f9f6ff;
      border: 2px solid #d9c9ff;
      font-weight: 800;
      font-size: 1rem;
      color: var(--ink);
      min-height: 54px;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .choice-btn:hover {
      background: #fff0f7;
      border-color: var(--pink);
      transform: scale(1.02);
    }

    .choice-btn.correct {
      background: #d8ffef;
      border-color: var(--mint-deep);
      color: #0f5c43;
    }

    .choice-btn.wrong {
      background: #ffe3e8;
      border-color: #e04f6c;
      color: #8a162e;
    }

    /* Opposite Word Match */
    .opp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .opp-btn {
      padding: 13px 10px;
      border-radius: 16px;
      background: #f0faff;
      border: 2.5px solid #5cc8ff;
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink);
      min-height: 54px;
      transition: transform 0.13s ease, background 0.13s ease;
    }

    .opp-btn:hover {
      transform: scale(1.02);
      background: #dff3ff;
    }

    .rhyme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .rhyme-btn {
      padding: 13px 10px;
      border-radius: 16px;
      background: #fff0f7;
      border: 2.5px solid #ff9ec7;
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink);
      min-height: 54px;
      transition: transform 0.13s ease, background 0.13s ease;
    }

    .rhyme-btn:hover {
      transform: scale(1.02);
      background: #ffe3f0;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(64px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 480px) {
      .memory-grid {
        grid-template-columns: repeat(3, minmax(68px, 1fr));
      }
    }

    .mem-card {
      min-height: 76px;
      border-radius: 16px;
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f3ecff, #ffe8f3);
      border: 2.5px solid #d4c1ff;
      color: var(--purple-deep);
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .mem-card.revealed {
      background: var(--white);
      border-color: var(--pink);
      transform: scale(1.02);
    }

    .mem-card.matched {
      background: #dcffef;
      border-color: var(--mint-deep);
      color: var(--ink);
    }

    .odd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .odd-btn {
      padding: 14px 10px;
      border-radius: 16px;
      background: #fff9e8;
      border: 2.5px solid #ffd166;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--ink);
      min-height: 64px;
      transition: transform 0.13s ease, background 0.13s ease;
    }

    .odd-btn:hover {
      transform: scale(1.03);
      background: #fff2cc;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .sound-tile {
      padding: 13px 10px;
      border-radius: 16px;
      background: #f0faff;
      border: 2.5px solid #9be0ff;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.13s ease, background 0.13s ease;
    }

    .sound-tile:hover {
      transform: translateY(-2px);
      background: #e3f6ff;
    }

    .pattern-stage {
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #f8f5ff 0%, #fff4fa 100%);
      border: 2px solid #dfd2ff;
    }

    .pattern-sequence {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 1.8rem;
      margin: 10px 0 12px;
    }

    .pattern-slot {
      min-width: 56px;
      min-height: 56px;
      padding: 6px 10px;
      border-radius: 14px;
      background: var(--white);
      border: 2.5px dashed var(--purple);
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .wordcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .word-flip-btn {
      padding: 14px 12px;
      border-radius: 16px;
      min-height: 82px;
      background: #fff7fb;
      border: 2.5px solid #ffd4ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 800;
      color: var(--ink);
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .word-flip-btn:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
    }

    .word-flip-btn.flipped {
      background: #f2ecff;
      border-color: var(--purple);
    }

    .worksheet-sheet {
      margin-top: 12px;
      background: #fffdf9;
      border: 2px solid #e3d6ff;
      border-radius: 18px;
      padding: 16px;
    }

    .worksheet-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 6px;
      border-bottom: 1.5px dashed #e5dcff;
      font-weight: 800;
    }

    .worksheet-row:last-child {
      border-bottom: none;
    }

    .trace-box {
      display: inline-block;
      min-width: 110px;
      text-align: center;
      padding: 6px 12px;
      border-radius: 10px;
      border: 2px dashed #b99eff;
      color: var(--muted);
      background: #ffffff;
    }

    @media print {
      .topbar, .nav-strip, .hero-card, .streak-banner, #view-world, #view-avatar, #view-rewards, #view-parent, #memory-arcade-panel, #wordcards-panel, #pattern-builder-panel, #sound-explorer-panel, #odd-spotter-panel, #rhyme-match-panel, #opposite-match-panel, .stage-banner, .section-head, #modules-grid, .footer-love, .no-print {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
      .container {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
      #view-games {
        display: block !important;
      }
      #worksheet-panel {
        display: block !important;
        border: 2px solid #2b2440 !important;
        box-shadow: none !important;
      }
    }

    .feedback-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      background: #f7f4ff;
      border: 2px dashed #cbb8ff;
      margin-top: 10px;
    }

    .avatar-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #fff7fb 0%, #f1ecff 100%);
      border-radius: 20px;
      padding: 14px;
      border: 2px solid #ffd8eb;
    }

    .custom-group {
      margin-bottom: 12px;
    }

    .custom-label {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      padding: 9px 13px;
      border-radius: 12px;
      background: #f6f2ff;
      border: 2px solid #dfd3ff;
      font-weight: 800;
      font-size: 0.85rem;
      min-height: 42px;
    }

    .opt-btn.selected {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: var(--white);
      border-color: transparent;
    }

    .opt-btn.locked {
      opacity: 0.72;
      background: #fff9e6;
      border-color: #ffd166;
    }

    .mission-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #faf8ff;
      border: 2px solid #ece4ff;
