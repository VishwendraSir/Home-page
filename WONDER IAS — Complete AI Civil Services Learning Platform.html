  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; background-color: #f1f5f9; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .hero-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #312e81 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    .map-pin {
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .map-pin:hover {
      transform: scale(1.25);
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.9));
    }
    .mind-node {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mind-node:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(30, 58, 138, 0.25);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.25s ease-out forwards; }

    @media print {
      #desktop-sidebar, #top-header, #mobile-bottom-nav, #toast-container, .no-print { display: none !important; }
      #main-wrapper { margin-left: 0 !important; padding: 0 !important; }
      body { background: white !important; }
    }

    /* WONDER IAS VERSION / THEME SWITCHER */
    body[data-wonder-version="1"] { --wonder-bg:#f1f5f9; --wonder-panel:#ffffff; --wonder-accent:#1e3a8a; --wonder-text:#1e293b; }
    body[data-wonder-version="2"] { --wonder-bg:#eaf6ff; --wonder-panel:#f8fdff; --wonder-accent:#0369a1; --wonder-text:#0c334a; }
    body[data-wonder-version="3"] { --wonder-bg:#0b1220; --wonder-panel:#111c2e; --wonder-accent:#8b5cf6; --wonder-text:#e5e7eb; color:var(--wonder-text); }
    body[data-wonder-version="4"] { --wonder-bg:#f8fafc; --wonder-panel:#ffffff; --wonder-accent:#0f766e; --wonder-text:#334155; }
    body[data-wonder-version] { background:var(--wonder-bg) !important; color:var(--wonder-text); transition:background .25s ease,color .25s ease; }
    body[data-wonder-version="2"] #top-header { background:rgba(240,249,255,.96) !important; border-color:#bae6fd !important; }
    body[data-wonder-version="2"] .hero-gradient { background:linear-gradient(135deg,#082f49 0%,#0369a1 55%,#0e7490 100%) !important; }
    body[data-wonder-version="2"] .glass-card { background:rgba(248,253,255,.97) !important; border-color:#bae6fd !important; }
    body[data-wonder-version="3"] #top-header { background:rgba(15,23,42,.96) !important; border-color:#334155 !important; color:#e5e7eb !important; }
    body[data-wonder-version="3"] #desktop-sidebar { background:#0b1220 !important; border-color:#273449 !important; }
    body[data-wonder-version="3"] #app-content .bg-white, body[data-wonder-version="3"] #app-content .glass-card { background:#111c2e !important; color:#e5e7eb !important; border-color:#334155 !important; }
    body[data-wonder-version="3"] #app-content .bg-slate-50, body[data-wonder-version="3"] #app-content .bg-slate-100 { background:#172338 !important; color:#e5e7eb !important; }
    body[data-wonder-version="3"] #app-content .text-slate-800, body[data-wonder-version="3"] #app-content .text-slate-700 { color:#e5e7eb !important; }
    body[data-wonder-version="3"] #app-content .text-slate-500, body[data-wonder-version="3"] #app-content .text-slate-400 { color:#a8b4c7 !important; }
    body[data-wonder-version="3"] input, body[data-wonder-version="3"] textarea, body[data-wonder-version="3"] select { background:#0b1220 !important; color:#e5e7eb !important; border-color:#475569 !important; }
    body[data-wonder-version="4"] #top-header { box-shadow:0 1px 8px rgba(15,23,42,.05); }
    body[data-wonder-version="4"] .glass-card { border-radius:12px !important; box-shadow:none !important; border-color:#e2e8f0 !important; }
    body[data-wonder-version="4"] #app-content { gap:1rem !important; }
    body[data-wonder-version="4"] #app-content .rounded-2xl { border-radius:12px !important; }
    body[data-wonder-version="4"] #app-content .shadow-xl, body[data-wonder-version="4"] #app-content .shadow-2xl { box-shadow:0 2px 8px rgba(15,23,42,.05) !important; }
    #wonder-version-control { max-width:118px; }
    @media (max-width:420px) { #wonder-version-control { max-width:92px; } #wonder-version-label { display:none; } }
  </style>
</head>
