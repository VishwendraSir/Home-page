<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manushree WonderWorld Admin</title><style>
body{font-family:system-ui;background:linear-gradient(135deg,#eef2ff,#fdf2f8);margin:0;padding:16px;color:#1f2937}main{max-width:900px;margin:auto}section,.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 22px #0001}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #cbd5e1}button{cursor:pointer;background:#4f46e5;color:white;border:0;margin:4px}button.reject{background:#dc2626}button.extend{background:#059669}.row{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:bold}.muted{color:#64748b;font-size:.9em}#items{display:grid;gap:12px}.card h3{margin:0 0 8px}.card p{margin:5px 0}.hidden{display:none}</style></head><body><main><h1>👑 Manushree WonderWorld Admin</h1><section><label>Worker API URL <input id="api" placeholder="https://your-worker.workers.dev" style="width:min(100%,500px)"></label><br><label>Admin token <input id="token" type="password" placeholder="ADMIN_TOKEN" style="width:min(100%,500px)"></label><div class="row"><button onclick="save()">Save settings</button><button onclick="load()">Refresh requests</button></div><p class="muted">Settings are stored only in this browser. Never share this admin page/token.</p></section><div id="msg"></div><div id="items"></div></main><script>
const $=id=>document.getElementById(id);function save(){localStorage.setItem("wwAdminApi",$("api").value.trim());localStorage.setItem("wwAdminToken",$("token").value);$("msg").textContent="Settings saved in this browser."}
$("api").value=localStorage.getItem("wwAdminApi")||"";$("token").value=localStorage.getItem("wwAdminToken")||"";
async function call(path,method="GET",body){const api=$("api").value.trim().replace(/\/$/,""),token=$("token").value;if(!api||!token)throw Error("API URL and admin token required");const r=await fetch(api+path,{method,headers:{Authorization:"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){save();$("msg").textContent="Loading…";try{const d=await call("/admin/list");$("msg").textContent=d.items.length+" membership request(s)";$("items").innerHTML=d.items.map(m=>'<article class="card"><h3>'+esc(m.name)+' — '+esc(m.plan)+'</h3><p>📱 '+esc(m.phone)+' | <span class="status">'+esc(m.status)+'</span></p><p>Requested: '+esc(m.requestedAt||"")+'</p><p>Expiry: '+esc(m.expiresAt||"Not active")+'</p><p>Child profile: '+esc(m.customName||"Manushree")+'</p><div class="row">'+(m.status!=="Approved"?'<button onclick="act(\'approve\',\''+m.requestId+'\')">Approve 30 days</button>':'')+'<button class="extend" onclick="act(\'extend\',\''+m.requestId+'\')">Extend 30 days</button><button class="reject" onclick="act(\'reject\',\''+m.requestId+'\')">Reject</button></div></article>').join("")||"<section>No requests found.</section>"}catch(e){$("msg").textContent="Error: "+e.message}}
async function act(action,id){let days=30;if(action==="approve"||action==="extend"){const n=prompt("Membership days?", "30");if(n===null)return;days=Math.max(1,Math.min(365,Number(n)||30))}if(action==="reject"&&!confirm("Reject this membership request?"))return;try{await call("/admin/"+action,"POST",{requestId:id,days});await load()}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
