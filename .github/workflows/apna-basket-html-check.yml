name: Apna Basket HTML Syntax Check
on:
  push:
    branches:
      - feature/apna-basket-secure-backend-integration
  workflow_dispatch:
jobs:
  html-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Extract inline scripts and run Node syntax checks
        run: python .github/scripts/check_apna_basket_js.py
