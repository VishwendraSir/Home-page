name: Refresh Owner Page Catalogue
on:
  push:
    branches: [main]
    paths-ignore:
      - "site-pages.json"
      - ".github/workflows/refresh-site-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build catalogue and wire page lock
        run: python scripts/build-site-pages.py
      - name: Audit all HTML pages and local navigation
        run: python scripts/audit-site.py --output /tmp/site-audit-report.json
      - name: Upload site audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: /tmp/site-audit-report.json
          if-no-files-found: ignore
      - name: Commit generated catalogue and page integrations
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh page catalogue and apply shared lock loader"
            git push
          fi
