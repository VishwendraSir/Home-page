<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source Verification V10</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui}header{padding:20px;background:linear-gradient(120deg,#17345c,#42235c)}main{max-width:1100px;margin:auto;padding:16px}.card{background:#151d33;border:1px solid #2b3858;border-radius:14px;padding:16px;margin:12px 0}input,textarea,select,button{background:#0c1428;color:#eef3ff;border:1px solid #344363;border-radius:8px;padding:9px}textarea{width:100%;min-height:120px}button{background:#294c85;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stat{padding:12px;background:#0c1428;border:1px solid #2b3858;border-radius:9px}.stat b{font-size:22px;display:block}.table{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2b3858;text-align:left;vertical-align:top}th{color:#8db7ff}.verified{color:#55d79c}.pending{color:#ffd166}.failed{color:#ff7482}.muted{color:#9eb0d1}</style><header><h1>🔎 SOURCE & ANSWER VERIFICATION V10</h1>SCIENCE CENTRE LEARNING HUB • Quality First</header><main><section class="card"><h2>Import Question Bank</h2><div class="row"><input type="file" id="file" accept=".json"><button onclick="audit()">Load & Review</button><button onclick="demo()">Demo</button><button onclick="exportReport()">Export Report</button></div><textarea id="data" placeholder="Paste JSON array or {questions:[...]}"></textarea></section><section class="card"><h2>Summary</h2><div id="stats" class="stats"></div><p id="msg" class="muted"></p></section><section class="card"><h2>Filters</h2><div class="row"><select id="filter" onchange="render()"><option value="">All</option><option>VERIFIED</option><option>NEEDS_EVIDENCE</option><option>ANSWER_REVIEW</option><option>REJECTED</option></select><input id="search" placeholder="Search" oninput="render()"></div></section><section class="card"><h2>Verification Queue</h2><div class="table"><table><thead><tr><th>Question</th><th>Source evidence</th><th>Answer check</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let items=[];const $=id=>document.getElementById(id);$('file').onchange=async e=>{if(e.target.files[0])$('data').value=await e.target.files[0].text()};
function read(){let d=JSON.parse($('data').value);return Array.isArray(d)?d:(d.questions||d.items||[])}
function qtext(q){return q.question_en||q.question||q.question_hi||q.text||''}
function check(q,i){let src=q.source_type||q.sourceType||q.source||'UNCLASSIFIED',url=q.source_url||q.source_reference||'',sv=q.source_verified===true,av=q.answer_verified===true;let status=q.review_status==='REJECTED'?'REJECTED':sv&&av?'VERIFIED':sv?'ANSWER_REVIEW':'NEEDS_EVIDENCE';return{q,i,src,url,sv,av,status}}
function audit(){try{items=read().map(check);$('msg').textContent='Review records loaded. This tool records reviewer-entered evidence flags; it does not independently prove authenticity or correctness.';render()}catch(e){$('msg').textContent='Import error: '+e.message}}
function render(){let f=$('filter').value,s=$('search').value.toLowerCase();let a=items.filter(x=>(!f||x.status===f)&&(!s||JSON.stringify(x.q).toLowerCase().includes(s)));$('rows').innerHTML=a.map(x=>'<tr><td><b>'+esc(qtext(x.q))+'</b><details><summary>Raw record</summary><pre>'+esc(JSON.stringify(x.q,null,2))+'</pre></details></td><td><span>'+esc(x.src)+'</span><p>'+(x.url?'<a target="_blank" href="'+esc(x.url)+'">Source ↗</a>':'<span class="pending">No source reference</span>')+'</p><label><input type="checkbox" '+(x.sv?'checked':'')+' onchange="toggleSource('+x.i+',this.checked)"> Source independently checked</label><p><input placeholder="Source URL/reference" value="'+esc(x.q.source_url||x.q.source_reference||'')+'" onchange="setField('+x.i+',\'source_url\',this.value)"></p></td><td><label><input type="checkbox" '+(x.av?'checked':'')+' onchange="toggleAnswer('+x.i+',this.checked)"> Answer independently checked</label><p>Answer: '+esc(x.q.answer??x.q.correct_answer??x.q.correctAnswer??'—')+'</p><textarea placeholder="Proof/citation/explanation notes" onchange="setField('+x.i+',\'verification_notes\',this.value)">'+esc(x.q.verification_notes||'')+'</textarea></td><td class="'+(x.status==='VERIFIED'?'verified':x.status==='REJECTED'?'failed':'pending')+'"><b>'+x.status+'</b><select onchange="setStatus('+x.i+',this.value)"><option value="">Manual status</option><option value="REJECTED">Reject</option><option value="NEEDS_EVIDENCE">Needs evidence</option><option value="ANSWER_REVIEW">Answer review</option></select></td></tr>').join('');let c=s=>items.filter(x=>x.status===s).length;$('stats').innerHTML=[['Total',items.length],['Verified',c('VERIFIED')],['Evidence Pending',c('NEEDS_EVIDENCE')],['Answer Review',c('ANSWER_REVIEW')],['Rejected',c('REJECTED')]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')}
function toggleSource(i,v){items[i].q.source_verified=v;items[i]=check(items[i].q,i);render()}function toggleAnswer(i,v){items[i].q.answer_verified=v;items[i]=check(items[i].q,i);render()}function setField(i,k,v){items[i].q[k]=v;items[i]=check(items[i].q,i);render()}function setStatus(i,v){if(v){items[i].q.review_status=v;items[i]=check(items[i].q,i);render()}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function demo(){$('data').value=JSON.stringify({questions:[{id:'SRC-001',question_en:'Demo question',answer:'Demo answer',source_type:'OFFICIAL_PYQ',source_url:'https://example.org',source_verified:false,answer_verified:false},{id:'SRC-002',question_en:'Second sample',answer:'B',source_type:'TEXTBOOK_BASED',source_reference:'Chapter reference',source_verified:true,answer_verified:false}]},null,2);audit()}
function exportReport(){let r={exported_at:new Date().toISOString(),notice:'Reviewer-entered verification flags; not independently authenticated.',summary:{total:items.length,verified:items.filter(x=>x.status==='VERIFIED').length,needs_evidence:items.filter(x=>x.status==='NEEDS_EVIDENCE').length,answer_review:items.filter(x=>x.status==='ANSWER_REVIEW').length,rejected:items.filter(x=>x.status==='REJECTED').length},questions:items.map(x=>({...x.q,verification_status:x.status}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download='source-answer-verification.json';a.click()}
</script></html>
